function _stApplyFilter(v){
  _stObjs.forEach(d=>{d.g.visible=!v||(d.projId===v);});
}

function _stSpeedPct(devId){
  const arr=(S.sprints||[]).filter(s=>s.completedHours&&s.completedHours[devId]!==undefined)
    .sort((a,b)=>b.startDate.localeCompare(a.startDate));
  if(!arr.length)return 0;
  const s=arr[0];
  const wd=workDaysInRange(s.startDate,s.endDate);
  const eff=Math.round(wd*8*.8);
  return eff?Math.round((s.completedHours[devId]||0)/eff*100):0;
}

function _stTier(pct){
  if(pct===0)  return{spd:0,   freq:0,   label:'Standing'};
  if(pct<=50)  return{spd:.003,freq:2.5, label:'Very Slow'};
  if(pct<=60)  return{spd:.006,freq:4.0, label:'Slow'};
  if(pct<=75)  return{spd:.010,freq:6.0, label:'Average'};
  if(pct<=85)  return{spd:.016,freq:9.0, label:'Fast'};
  return               {spd:.024,freq:13, label:'Very Fast'};
}

function _stNameLabel(name,labelY){
  const c=document.createElement('canvas');c.width=256;c.height=72;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,.7)';
  if(ctx.roundRect){ctx.roundRect(4,4,248,64,10);ctx.fill();}else{ctx.fillRect(4,4,248,64);}
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(name,128,36);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(1.3,.37,1);sp.position.y=labelY||1.75;
  return sp;
}

function _stTagGroup(g,idx){g.traverse(c=>{c.userData.devIdx=idx;});}

function _stMakeDev(name,female,shirtColor,pct){
  const ph=_stPhysique(pct||0);
  const g=new THREE.Group();
  const skin=new THREE.MeshLambertMaterial({color:0xF5CBA7});
  const shirt=new THREE.MeshLambertMaterial({color:shirtColor});
  const pants=new THREE.MeshLambertMaterial({color:0x1a1a3e});
  const hair=new THREE.MeshLambertMaterial({color:female?0x3d1a00:0x1a0a00});
  const shoe=new THREE.MeshLambertMaterial({color:0xf0f0f0});

  const base=.05;
  const hipY=ph.legL+base;
  const shoulderY=hipY+ph.tH*.75;
  const headY=hipY+ph.tH+ph.hdR*.9;

  function makeLeg(sx){
    const p=new THREE.Group();p.position.set(sx*ph.tB*.65,hipY,0);
    const lm=new THREE.Mesh(new THREE.CylinderGeometry(ph.tB*.36,ph.tB*.3,ph.legL,8),pants);
    lm.position.y=-ph.legL/2;p.add(lm);
    const sh=new THREE.Mesh(new THREE.BoxGeometry(.09,.065,.18),shoe);
    sh.position.set(0,-ph.legL-.02,.045);p.add(sh);
    g.add(p);return p;
  }
  const llP=makeLeg(-1),rlP=makeLeg(1);

  const torso=new THREE.Mesh(new THREE.CylinderGeometry(ph.tR*.82,ph.tR,ph.tH,10),shirt);
  torso.position.y=hipY+ph.tH/2;g.add(torso);

  function makeArm(sx){
    const p=new THREE.Group();p.position.set(sx*(ph.tR+.04),shoulderY,0);
    const am=new THREE.Mesh(new THREE.CylinderGeometry(ph.tR*.28,ph.tR*.22,ph.armL,8),shirt);
    am.position.y=-ph.armL/2;p.add(am);
    g.add(p);return p;
  }
  const laP=makeArm(-1),raP=makeArm(1);

  const head=new THREE.Mesh(new THREE.SphereGeometry(ph.hdR,14,14),skin);
  head.position.y=headY;g.add(head);
  const hairM=new THREE.Mesh(new THREE.SphereGeometry(ph.hdR+.005,14,14,0,Math.PI*2,0,Math.PI*.54),hair);
  hairM.position.y=headY+.03;g.add(hairM);
  if(female){const bun=new THREE.Mesh(new THREE.SphereGeometry(ph.hdR*.48,10,10),hair);bun.position.set(0,headY+ph.hdR*.7,-ph.hdR*.65);g.add(bun);}

  const label=_stNameLabel(name,headY+ph.hdR+.55);
  g.add(label);
  return{g,laP,raP,llP,rlP,label};
}

function _stMakeSpectator(x,y,z,color){
  const g=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color});
  const skinMat=new THREE.MeshLambertMaterial({color:0xF0C27F});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.3,8),mat);body.position.y=.15;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),skinMat);head.position.y=.42;g.add(head);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.04,.035,.22,6),mat);
  arm.position.set(.12,.32,0);arm.rotation.z=.9;g.add(arm);
  g.userData.arm=arm;
  g.position.set(x,y,z);
  return g;
}

function _stBuildStadium(sc){
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0x2d5a27}));
  gnd.rotation.x=-Math.PI/2;gnd.position.y=-.02;sc.add(gnd);

  const segs=80;
  function mkEllipse(ax,bx){
    const sh=new THREE.Shape();
    for(let i=0;i<=segs;i++){const a=i/segs*Math.PI*2;sh[i===0?'moveTo':'lineTo'](ax*Math.cos(a),bx*Math.sin(a));}
    return sh;
  }

  const track=mkEllipse(11,8);
  const hole=new THREE.Path();
  for(let i=0;i<=segs;i++){const a=i/segs*Math.PI*2;hole[i===0?'moveTo':'lineTo'](8.5*Math.cos(a),5.5*Math.sin(a));}
  track.holes=[hole];
  const trackM=new THREE.Mesh(new THREE.ShapeGeometry(track,64),new THREE.MeshLambertMaterial({color:0xB03A2E}));
  trackM.rotation.x=-Math.PI/2;sc.add(trackM);

  const infM=new THREE.Mesh(new THREE.ShapeGeometry(mkEllipse(8.5,5.5),64),new THREE.MeshLambertMaterial({color:0x3a7a32}));
  infM.rotation.x=-Math.PI/2;infM.position.y=.01;sc.add(infM);

  [{a:9.1,b:6.1},{a:9.75,b:6.75},{a:10.4,b:7.35}].forEach(({a,b})=>{
    const pts=[];
    for(let i=0;i<=segs;i++){const ang=i/segs*Math.PI*2;pts.push(new THREE.Vector3(a*Math.cos(ang),.015,b*Math.sin(ang)));}
    sc.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff})));
  });
  sc.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(8.5,.015,0),new THREE.Vector3(11,.015,0)]),new THREE.LineBasicMaterial({color:0xffff00})));

  // Grandstands
  const sM=new THREE.MeshLambertMaterial({color:0x455A64});
  const stM=new THREE.MeshLambertMaterial({color:0x1565C0});
  [-11,11].forEach(z=>{
    const sign=z<0?-1:1;
    const b=new THREE.Mesh(new THREE.BoxGeometry(28,2.5,4.5),sM);b.position.set(0,1.25,z+sign*2.5);sc.add(b);
    const s=new THREE.Mesh(new THREE.BoxGeometry(26,.5,3.5),stM);s.position.set(0,2.75,z+sign*2.6);sc.add(s);
  });
  [-16,16].forEach(x=>{
    const sign=x<0?-1:1;
    const b=new THREE.Mesh(new THREE.BoxGeometry(5,2,18),sM);b.position.set(x+sign*2.5,1,0);sc.add(b);
    const s=new THREE.Mesh(new THREE.BoxGeometry(4,.5,17),stM);s.position.set(x+sign*2.5,2.3,0);sc.add(s);
  });

  // Spectators with ~30% waving
  const spc=[0xFF6B6B,0x4ECDC4,0xFFE66D,0xA8E6CF,0xFF8B94,0xC7B3E5,0xFFC3A0,0x88D8B0,0xE695AA,0xFF9A9E];
  let si=0;_stWavers=[];
  [-11,11].forEach(z=>{
    const sign=z<0?-1:1;
    for(let row=0;row<2;row++){
      for(let col=-11;col<=11;col+=2.2){
        const sg=_stMakeSpectator(col,2.9+row*.38,z+sign*2.6+sign*row*.25,spc[si++%spc.length]);
        sc.add(sg);
        if(Math.random()<.3)_stWavers.push({g:sg,phase:Math.random()*Math.PI*2,freq:.6+Math.random()*.9});
      }
    }
  });
  [-16,16].forEach(x=>{
    const sign=x<0?-1:1;
    for(let row=0;row<2;row++){
      for(let col=-7;col<=7;col+=2.2){
        const sg=_stMakeSpectator(x+sign*2.5+sign*row*.25,2.5+row*.38,col,spc[si++%spc.length]);
        sc.add(sg);
        if(Math.random()<.3)_stWavers.push({g:sg,phase:Math.random()*Math.PI*2,freq:.6+Math.random()*.9});
      }
    }
  });

  // Light poles
  const pM=new THREE.MeshLambertMaterial({color:0x78909C});
  [[14,9],[14,-9],[-14,9],[-14,-9]].forEach(([px,pz])=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,12,8),pM);pole.position.set(px,6,pz);sc.add(pole);
    const lt=new THREE.Mesh(new THREE.BoxGeometry(1.2,.5,.5),new THREE.MeshLambertMaterial({color:0xFFFDE7,emissive:0xFFF59D,emissiveIntensity:.5}));
    lt.position.set(px,12.3,pz);sc.add(lt);
  });

  // Scoreboard
  const sbBd=new THREE.Mesh(new THREE.BoxGeometry(8,4,.5),new THREE.MeshLambertMaterial({color:0x212121}));
  sbBd.position.set(0,5.5,-17);sc.add(sbBd);
  const sbSc=new THREE.Mesh(new THREE.PlaneGeometry(7.2,3.4),new THREE.MeshLambertMaterial({color:0x0D1B2A,emissive:0x0D47A1,emissiveIntensity:.3}));
  sbSc.position.set(0,5.5,-16.74);sc.add(sbSc);

  // ── Field event props ──────────────────────────────
  // Javelin (Ryan) — thin cylinder lying on ground near station
  const jvMat=new THREE.MeshLambertMaterial({color:0xD4A017});
  const jv=new THREE.Mesh(new THREE.CylinderGeometry(.02,.015,2.6,8),jvMat);
  jv.position.set(-5.5,.04,.4);jv.rotation.z=Math.PI/2;sc.add(jv);

  // Shot put (Christopher) — circle + ball
  const spCirc=new THREE.Mesh(new THREE.RingGeometry(1.0,1.12,32),new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide}));
  spCirc.position.set(4.5,.02,-2);spCirc.rotation.x=-Math.PI/2;sc.add(spCirc);
  const spBall=new THREE.Mesh(new THREE.SphereGeometry(.18,12,12),new THREE.MeshLambertMaterial({color:0x888888}));
  spBall.position.set(4.5,.2,-2);sc.add(spBall);

  // Long jump (Norman) — sandpit + runway line
  const pitM=new THREE.Mesh(new THREE.BoxGeometry(1.5,.1,3.2),new THREE.MeshLambertMaterial({color:0xC2A060}));
  pitM.position.set(.5,.02,0);sc.add(pitM);
  sc.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(.5,.02,-4.5),new THREE.Vector3(.5,.02,-1)]),new THREE.LineBasicMaterial({color:0xffffff})));

  // High jump (Raja) — standards + bar + mat
  const stdMat=new THREE.MeshLambertMaterial({color:0x607080});
  [-1,1].forEach(sx=>{
    const std=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2,8),stdMat);
    std.position.set(2+sx,1,2.5);sc.add(std);
    const basem=new THREE.Mesh(new THREE.BoxGeometry(.4,.08,.4),stdMat);
    basem.position.set(2+sx,.04,2.5);sc.add(basem);
  });
  const hjBar=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,2,8),new THREE.MeshLambertMaterial({color:0xFF6B00}));
  hjBar.position.set(2,1.38,2.5);hjBar.rotation.z=Math.PI/2;sc.add(hjBar);
  const mat=new THREE.Mesh(new THREE.BoxGeometry(2,.18,1.2),new THREE.MeshLambertMaterial({color:0x4A90D9}));
  mat.position.set(2,.09,2.5);sc.add(mat);
}

// ── BA Field Event Animations ────────────────────────

function _stAnimateJavelin(d,t,dt){
  if(!d.stateT)d.stateT=t;
  const e=t-d.stateT;
  if(d.baState==='idle'){
    d.g.rotation.y=Math.PI/2;
    d.raP.rotation.x=0;d.laP.rotation.x=0;d.g.rotation.z=0;
    if(e>2.5){d.baState='windup';d.stateT=t;}
  } else if(d.baState==='windup'){
    const wu=Math.min(e/.8,1);
    d.raP.rotation.x=-Math.PI*.55*wu;
    d.laP.rotation.x=Math.PI*.2*wu;
    d.g.rotation.z=.1*wu;
    if(e>.8){d.baState='release';d.stateT=t;}
  } else if(d.baState==='release'){
    const r=Math.min(e/.25,1);
    d.raP.rotation.x=-Math.PI*.55+Math.PI*r;
    if(e>.25){d.baState='recover';d.stateT=t;}
  } else {
    const rv=Math.min(e/.7,1);
    d.raP.rotation.x=Math.PI*.45*(1-rv);
    d.laP.rotation.x=Math.PI*.2*(1-rv);
    d.g.rotation.z=.1*(1-rv);
    if(e>.7){d.baState='idle';d.stateT=t;}
  }
}

function _stAnimateShotPut(d,t,dt){
  if(!d.stateT)d.stateT=t;
  const e=t-d.stateT;
  if(d.baState==='idle'){
    d.g.rotation.y=0;d.raP.rotation.x=0;d.laP.rotation.x=0;
    d.raP.rotation.z=0;d.g.position.y=0;
    if(e>2.5){d.baState='crouch';d.stateT=t;}
  } else if(d.baState==='crouch'){
    const c=Math.min(e/.4,1);
    d.g.position.y=-.1*c;d.raP.rotation.x=Math.PI*.3*c;
    if(e>.4){d.baState='spin';d.stateT=t;d._spinY=d.g.rotation.y;}
  } else if(d.baState==='spin'){
    const s=Math.min(e/.5,1);
    d.g.rotation.y=(d._spinY||0)+Math.PI*s;
    if(e>.5){d.baState='push';d.stateT=t;}
  } else if(d.baState==='push'){
    const p=Math.min(e/.3,1);
    d.raP.rotation.x=Math.PI*.3-Math.PI*.7*p;
    d.raP.rotation.z=-.4*p;
    if(e>.3){d.baState='recover';d.stateT=t;}
  } else {
    const rv=Math.min(e/.5,1);
    d.g.position.y=-.1*(1-rv);
    d.raP.rotation.x=-Math.PI*.4*(1-rv);
    d.raP.rotation.z=-.4*(1-rv);
    if(e>.5){d.baState='idle';d.stateT=t;d.g.rotation.y=0;}
  }
}

function _stAnimateLongJump(d,t,dt){
  if(!d.stateT)d.stateT=t;
  const e=t-d.stateT;
  const spd=dt*2.8;
  if(d.baState==='idle'){
    d.g.rotation.y=0;d.llP.rotation.x=0;d.rlP.rotation.x=0;d.laP.rotation.x=0;d.raP.rotation.x=0;
    if(e>1.5){d.baState='approach';d.stateT=t;}
  } else if(d.baState==='approach'){
    d.g.position.z+=spd*1.8;
    const ph=t*9;
    d.llP.rotation.x=.55*Math.sin(ph);d.rlP.rotation.x=-.55*Math.sin(ph);
    d.laP.rotation.x=-.35*Math.sin(ph);d.raP.rotation.x=.35*Math.sin(ph);
    if(d.g.position.z>=-1){d.baState='leap';d.stateT=t;d._jz=d.g.position.z;}
  } else if(d.baState==='leap'){
    const frac=Math.min(e/.65,1);
    d.g.position.z=(d._jz||0)+2.8*frac;
    d.g.position.y=.85*Math.sin(frac*Math.PI);
    d.raP.rotation.x=-Math.PI*.5;d.laP.rotation.x=-Math.PI*.5;
    d.llP.rotation.x=Math.PI*.4*Math.sin(frac*Math.PI);
    d.rlP.rotation.x=Math.PI*.4*Math.sin(frac*Math.PI);
    if(e>.65){d.baState='land';d.stateT=t;}
  } else if(d.baState==='land'){
    d.g.position.y=0;d.raP.rotation.x=0;d.laP.rotation.x=0;d.llP.rotation.x=0;d.rlP.rotation.x=0;
    if(e>1){d.baState='return';d.stateT=t;}
  } else {
    d.g.position.z-=spd;d.g.rotation.y=Math.PI;
    const ph=t*5;d.llP.rotation.x=.3*Math.sin(ph);d.rlP.rotation.x=-.3*Math.sin(ph);
    if(d.g.position.z<=-4.2){d.g.rotation.y=0;d.g.position.set(.5,0,-4.5);d.baState='idle';d.stateT=t;}
  }
}

function _stAnimateHighJump(d,t,dt){
  if(!d.stateT)d.stateT=t;
  const e=t-d.stateT;
  const spd=dt*2.0;
  if(d.baState==='idle'){
    d.g.rotation.y=0;d.g.rotation.x=0;
    d.raP.rotation.x=0;d.laP.rotation.x=0;d.llP.rotation.x=0;d.rlP.rotation.x=0;
    if(e>2){d.baState='approach';d.stateT=t;}
  } else if(d.baState==='approach'){
    d.g.position.z+=spd*1.5;
    const ph=t*7;
    d.llP.rotation.x=.5*Math.sin(ph);d.rlP.rotation.x=-.5*Math.sin(ph);
    d.laP.rotation.x=-.3*Math.sin(ph);d.raP.rotation.x=.3*Math.sin(ph);
    if(d.g.position.z>=1.5){d.baState='jump';d.stateT=t;}
  } else if(d.baState==='jump'){
    const frac=Math.min(e/.75,1);
    d.g.position.y=1.6*Math.sin(frac*Math.PI);
    d.g.rotation.x=-Math.PI*.25*Math.sin(frac*Math.PI);
    d.raP.rotation.x=-Math.PI*.6;d.laP.rotation.x=-Math.PI*.6;
    d.llP.rotation.x=.45;d.rlP.rotation.x=.45;
    if(e>.75){d.baState='land';d.stateT=t;}
  } else {
    d.g.position.y=0;d.g.rotation.x=0;
    d.raP.rotation.x=0;d.laP.rotation.x=0;d.llP.rotation.x=0;d.rlP.rotation.x=0;
    if(e>1){d.g.position.set(2,0,-1);d.baState='idle';d.stateT=t;}
  }
}

// ── Profile Panel ───────────────────────────────────

function _stSelectDev(idx){
  const d=_stObjs[idx];if(!d)return;
  const panel=document.getElementById('st-profile-panel');if(!panel)return;
  const per=d.per;const pct=d.pct||0;
  const ph=_stPhysique(pct);
  const projName=(S.projects||[]).find(p=>p.id===((per.projectIds||[])[0]||''))?.name||'—';
  const physColor=pct<=50?'#ef4444':pct<=60?'#f97316':pct<=75?'#eab308':'#22c55e';
  const recentSprints=(S.sprints||[])
    .filter(s=>s.completedHours&&s.completedHours[per.id]!==undefined)
    .sort((a,b)=>b.startDate.localeCompare(a.startDate)).slice(0,3);
  const sprintRows=recentSprints.map(s=>{
    const wd=workDaysInRange(s.startDate,s.endDate);
    const eff=Math.round(wd*8*.8)||1;
    const p=Math.min(200,Math.round((s.completedHours[per.id]||0)/eff*100));
    return`<div style="font-size:11px;display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.08)"><span style="color:rgba(255,255,255,.7)">${s.name}</span><span style="color:#10b981;font-weight:700">${p}%</span></div>`;
  }).join('');
  panel.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b style="font-size:14px">${per.name}</b>
      <button onclick="_stHideProfile()" style="background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:18px;line-height:1;padding:0">×</button>
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,.55);margin-bottom:6px">${per.role||'—'} · ${projName}</div>
    ${d.isBA?`<div style="font-size:12px;color:#FFD700;margin-bottom:8px">🏅 ${d.fieldEvent}</div>`:''}
    <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:10px">
      <div><div style="font-size:26px;font-weight:900;color:${physColor};line-height:1">${pct}%</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Velocity</div></div>
      <div><div style="font-size:13px;font-weight:700;color:${physColor}">${ph.label}</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Physique</div></div>
    </div>
    ${sprintRows?`<div style="font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Recent Sprints</div>${sprintRows}`:''}
  `;
  panel.style.display='block';
}

function _stHideProfile(){
  const p=document.getElementById('st-profile-panel');if(p)p.style.display='none';
}

function openSprintTrack(){
  document.getElementById('sprint-track-overlay').classList.add('open');
  if(!_stRenderer)_stInit();
}

function closeSprintTrack(){
  _stHideProfile();
  document.getElementById('sprint-track-overlay').classList.remove('open');
  if(_stAnimId){cancelAnimationFrame(_stAnimId);_stAnimId=null;}
  if(_stRO){_stRO.disconnect();_stRO=null;}
  if(_stRenderer){_stRenderer.dispose();_stRenderer=null;_stScene=null;_stCam=null;_stObjs=[];_stWavers=[];}
}

function _stInit(){
  if(typeof THREE==='undefined'){alert('Three.js not loaded. Please refresh and try again.');return;}
  const canvas=document.getElementById('sprint-track-canvas');
  const W=canvas.clientWidth||900,H=canvas.clientHeight||520;

  _stScene=new THREE.Scene();
  _stScene.background=new THREE.Color(0x87CEEB);
  _stScene.fog=new THREE.Fog(0x87CEEB,50,90);

  _stCam=new THREE.PerspectiveCamera(50,W/H,.1,200);
  _stPanX=0;_stPanZ=0;_stCamH=22;_stCamD=24;_stPaused=false;
  _stSetCam();

  _stRenderer=new THREE.WebGLRenderer({canvas,antialias:true});
  _stRenderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  _stRenderer.setSize(W,H);

  _stScene.add(new THREE.AmbientLight(0xffffff,.8));
  const sun=new THREE.DirectionalLight(0xFFF8E1,.85);sun.position.set(8,20,12);_stScene.add(sun);
  const fill=new THREE.DirectionalLight(0xE3F2FD,.3);fill.position.set(-10,8,-5);_stScene.add(fill);

  _stBuildStadium(_stScene);
  _stRaycaster=new THREE.Raycaster();

  const today=new Date().toISOString().slice(0,10);
  const allDevs=(S.personnel||[]).filter(p=>!p.offboard||(p.offboardDate&&p.offboardDate>=today));
  _stObjs=[];

  // ── Project velocity averages for scoreboard ──
  const projVel={};
  (S.sprints||[]).forEach(s=>{
    const st=sprintStats(s);
    if(st.pct>0){if(!projVel[s.projectId]){projVel[s.projectId]={sum:0,n:0};}projVel[s.projectId].sum+=st.pct;projVel[s.projectId].n++;}
  });
  let sbHTML='<div class="st-sb-hdr">⚡ Sprint Board</div>';
  Object.entries(projVel).forEach(([pid,v])=>{
    const pn=(S.projects||[]).find(p=>p.id===pid)?.name||pid;
    const dot=pid==='p_orion'?'#E91E8C':pid==='p_polaris'?'#29B6F6':pid==='p_cordis'?'#FDD835':'#9E9E9E';
    const avg=v.n?Math.round(v.sum/v.n):0;
    sbHTML+=`<div class="st-sb-row"><div class="st-sb-dot" style="background:${dot}"></div><div class="st-sb-name">${pn}</div><div><div class="st-sb-pct">${avg}%</div><div class="st-sb-spd">avg velocity</div></div></div>`;
  });
  sbHTML+='<div class="st-sb-hdr" style="margin-top:12px">Athletes</div>';

  const runners=allDevs.filter(p=>!_stIsBA(p));
  const bas=allDevs.filter(p=>_stIsBA(p));

  runners.forEach((per,i)=>{
    const projId=(per.projectIds||[])[0]||'';
    const shirtHex=_ST_COLORS[projId]||0xBDBDBD;
    const female=_ST_FEMALE.has(per.name.toLowerCase());
    const pct=_stSpeedPct(per.id);
    const{spd,freq,label}=_stTier(pct);
    const ph=_stPhysique(pct);
    const lane=_ST_LANES[i%3];
    const angle=(i/Math.max(runners.length,1))*Math.PI*2;
    const dev=_stMakeDev(per.name,female,shirtHex,pct);
    dev.g.position.set(lane.a*Math.cos(angle),0,lane.b*Math.sin(angle));
    dev.g.rotation.y=Math.atan2(-lane.a*Math.sin(angle),lane.b*Math.cos(angle));
    const idx=_stObjs.length;
    _stScene.add(dev.g);
    _stTagGroup(dev.g,idx);
    _stObjs.push({...dev,angle,spd,freq,lA:lane.a,lB:lane.b,pct,isBA:false,projId,per});
    const dot=projId==='p_orion'?'#E91E8C':projId==='p_polaris'?'#29B6F6':projId==='p_cordis'?'#FDD835':'#9E9E9E';
    sbHTML+=`<div class="st-sb-row st-sb-clickable" onclick="_stSelectDev(${idx})"><div class="st-sb-dot" style="background:${dot}"></div><div class="st-sb-name">${per.name}</div><div><div class="st-sb-pct">${pct}%</div><div class="st-sb-spd">${label} · ${ph.label}</div></div></div>`;
  });

  bas.forEach(per=>{
    const projId=(per.projectIds||[])[0]||'';
    const shirtHex=_ST_COLORS[projId]||0xBDBDBD;
    const female=_ST_FEMALE.has(per.name.toLowerCase());
    const pct=_stSpeedPct(per.id);
    const eventKey=_ST_BA_EVENTS[per.name.toLowerCase()]||'idle';
    const eventLabel={javelin:'Javelin Throw',shotput:'Shot Put',longjump:'Long Jump',highjump:'High Jump'}[eventKey]||'Coordinator';
    const pos=_ST_BA_POS[eventKey]||{x:0,z:0};
    const dev=_stMakeDev(per.name,female,shirtHex,pct);
    // Set initial position based on event
    if(eventKey==='longjump')dev.g.position.set(.5,0,-4.5);
    else if(eventKey==='highjump')dev.g.position.set(2,0,-1);
    else dev.g.position.set(pos.x,0,pos.z);
    const idx=_stObjs.length;
    _stScene.add(dev.g);
    _stTagGroup(dev.g,idx);
    _stObjs.push({...dev,isBA:true,baState:'idle',stateT:0,projId,per,pct,fieldEvent:eventLabel,eventKey});
    const dot=projId==='p_orion'?'#E91E8C':projId==='p_polaris'?'#29B6F6':projId==='p_cordis'?'#FDD835':'#9E9E9E';
    sbHTML+=`<div class="st-sb-row st-sb-clickable" onclick="_stSelectDev(${idx})"><div class="st-sb-dot" style="background:${dot}"></div><div class="st-sb-name">${per.name}</div><div><div class="st-sb-pct" style="color:#FFD700">BA</div><div class="st-sb-spd">${eventLabel}</div></div></div>`;
  });

  document.getElementById('st-scoreboard').innerHTML=sbHTML;

  // ── Pan + click to select ──────────────────────────
  let _drag=false,_mx=0,_my=0,_downX=0,_downY=0,_didDrag=false;
  canvas.addEventListener('mousedown',e=>{_drag=true;_mx=e.clientX;_my=e.clientY;_downX=e.clientX;_downY=e.clientY;_didDrag=false;e.preventDefault();});
  canvas.addEventListener('mouseup',()=>_drag=false);
  canvas.addEventListener('mouseleave',()=>_drag=false);
  canvas.addEventListener('mousemove',e=>{
    if(!_drag)return;
    if(Math.abs(e.clientX-_downX)>4||Math.abs(e.clientY-_downY)>4)_didDrag=true;
    _stPanX-=(e.clientX-_mx)*.04;_stPanZ-=(e.clientY-_my)*.04;
    _mx=e.clientX;_my=e.clientY;_stSetCam();
  });
  canvas.addEventListener('click',e=>{
    if(_didDrag)return;
    const rect=canvas.getBoundingClientRect();
    const nx=((e.clientX-rect.left)/rect.width)*2-1;
    const ny=-((e.clientY-rect.top)/rect.height)*2+1;
    _stRaycaster.setFromCamera({x:nx,y:ny},_stCam);
    const hits=_stRaycaster.intersectObjects(_stObjs.map(d=>d.g),true);
    if(hits.length&&hits[0].object.userData.devIdx!==undefined){
      _stSelectDev(hits[0].object.userData.devIdx);
    } else {
      _stHideProfile();
    }
  });
  canvas.addEventListener('wheel',e=>{
    _stCamD=Math.max(8,Math.min(55,_stCamD+e.deltaY*.05));
    _stCamH=Math.max(6,Math.min(45,_stCamH+e.deltaY*.03));
    _stSetCam();
  },{passive:true});
  canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){_drag=true;_mx=e.touches[0].clientX;_my=e.touches[0].clientY;_downX=_mx;_downY=_my;_didDrag=false;}},{passive:true});
  canvas.addEventListener('touchend',()=>_drag=false);
  canvas.addEventListener('touchmove',e=>{
    if(!_drag||e.touches.length!==1)return;
    if(Math.abs(e.touches[0].clientX-_downX)>4||Math.abs(e.touches[0].clientY-_downY)>4)_didDrag=true;
    _stPanX-=(e.touches[0].clientX-_mx)*.04;_stPanZ-=(e.touches[0].clientY-_my)*.04;
    _mx=e.touches[0].clientX;_my=e.touches[0].clientY;_stSetCam();
  },{passive:true});

  // Sync filter & pause UI state
  const sf=document.getElementById('st-sys-filter');if(sf)sf.value='';
  const pb=document.getElementById('st-pause-btn');if(pb)pb.textContent='⏸';

  _stClock=new THREE.Clock();
  let _prevT=0;
  const loop=()=>{
    _stAnimId=requestAnimationFrame(loop);
    if(_stPaused){_stRenderer.render(_stScene,_stCam);return;}
    const t=_stClock.getElapsedTime();
    const dt=Math.min(t-_prevT,.05);_prevT=t;

    _stObjs.forEach(d=>{
      if(!d.g.visible)return;
      if(d.isBA){
        if(d.eventKey==='javelin')_stAnimateJavelin(d,t,dt);
        else if(d.eventKey==='shotput')_stAnimateShotPut(d,t,dt);
        else if(d.eventKey==='longjump')_stAnimateLongJump(d,t,dt);
        else if(d.eventKey==='highjump')_stAnimateHighJump(d,t,dt);
      } else if(d.spd>0){
        d.angle+=d.spd;
        d.g.position.x=d.lA*Math.cos(d.angle);
        d.g.position.z=d.lB*Math.sin(d.angle);
        d.g.rotation.y=Math.atan2(-d.lA*Math.sin(d.angle),d.lB*Math.cos(d.angle));
        const ph=t*d.freq;
        d.llP.rotation.x= .55*Math.sin(ph);
        d.rlP.rotation.x=-.55*Math.sin(ph);
        d.laP.rotation.x=-.35*Math.sin(ph);
        d.raP.rotation.x= .35*Math.sin(ph);
        d.g.position.y=.04*Math.abs(Math.sin(ph*2));
      } else {
        d.g.rotation.z=.04*Math.sin(t*1.2+(d.angle||0)*7);
        d.g.position.y=.01*Math.sin(t*1.8+(d.angle||0)*3);
      }
    });

    _stWavers.forEach(w=>{
      if(w.g.userData.arm)w.g.userData.arm.rotation.z=.9+.45*Math.sin(t*w.freq+w.phase);
    });

    _stRenderer.render(_stScene,_stCam);
  };
  loop();

  _stRO=new ResizeObserver(()=>{
    const w=canvas.clientWidth,h=canvas.clientHeight;
    if(!w||!h||!_stCam)return;
    _stCam.aspect=w/h;_stCam.updateProjectionMatrix();
    _stRenderer.setSize(w,h);
  });
  _stRO.observe(canvas);
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
load();
renderProjects();
</script>
