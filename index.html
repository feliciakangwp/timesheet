<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timesheet Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1e3a5f;--primary-light:#2d5a8e;--accent:#3b82f6;
  --bg:#f0f4f8;--white:#fff;--border:#e2e8f0;
  --text:#1e293b;--muted:#64748b;
  --success:#16a34a;--warning:#d97706;--danger:#dc2626;
  --radius:10px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* HEADER */
.app-header{background:var(--primary);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn-sprint-track{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.45);color:#fff;padding:6px 15px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:-.2px}
.btn-sprint-track:hover{background:rgba(255,255,255,.28)}
.app-header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.app-header h1 span{font-weight:300;opacity:.7}

/* NAV */
.nav{background:#fff;border-bottom:2px solid var(--border);display:flex;padding:0 24px;overflow-x:auto;position:sticky;top:56px;z-index:99}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:0 18px;height:48px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.nav-btn:hover{color:var(--primary)}
.nav-btn.active{color:var(--primary);border-bottom-color:var(--primary)}

/* PAGES */
.page{display:none;padding:24px;max-width:1280px;margin:0 auto}
.page.active{display:block}

/* CARD */
.card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:20px}
.card-title{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-badge{font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;font-weight:600}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-secondary,.btn-ghost{background:#f1f5f9;color:var(--text)}
.btn-secondary:hover,.btn-ghost:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:var(--danger)}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 12px;font-size:12px}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);transition:border-color .2s;outline:none;background:#fff}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.input-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.input-row .form-group{flex:1;margin-bottom:0}

/* RATE ROW */
.rate-entry{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;flex-wrap:wrap}
.rate-entry .form-group{flex:1;min-width:100px;margin-bottom:0}

/* PROJECT CHIPS */
.proj-chips{display:flex;gap:8px;flex-wrap:wrap}
.proj-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;user-select:none}
.proj-chip.checked{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.proj-chip input{display:none}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--primary);color:#fff;padding:10px 14px;text-align:left;font-weight:600;white-space:nowrap;font-size:12px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc}
.empty-row{text-align:center;padding:32px!important;color:var(--muted)}

/* WORKING DAYS GRID */
.wd-year-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.wd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:600px){.wd-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.wd-grid{grid-template-columns:repeat(2,1fr)}}
.wd-cell{background:var(--surface-2,#f8fafc);border:1.5px solid var(--border,#e2e8f0);
  border-radius:10px;padding:14px 10px 10px;text-align:center;transition:border-color .15s}
.wd-cell.wd-has{border-color:#2563eb}
.wd-mn{font-size:11px;font-weight:700;color:var(--muted,#64748b);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.wd-inp{width:100%;text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:22px;font-weight:600;border:none;background:transparent;
  color:var(--text,#1e293b);padding:0;outline:none;-moz-appearance:textfield}
.wd-inp::-webkit-outer-spin-button,.wd-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.wd-inp::placeholder{color:#cbd5e1;font-size:18px}

/* STATUS */
.status{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-active{background:#dcfce7;color:#15803d}
.status-offboard{background:#fee2e2;color:#b91c1c}

/* OFFBOARD BOX */
.offboard-box{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
.offboard-box label{font-size:13px;font-weight:600;color:var(--warning);cursor:pointer}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cal-nav h2{font-size:17px;font-weight:700;color:var(--primary)}
.cal-arrow{background:#fff;border:1.5px solid var(--border);border-radius:8px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.cal-arrow:hover{border-color:var(--accent);color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
.cal-cell{min-height:72px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:5px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell.weekend{background:#f8fafc}
.cal-cell.holiday{background:#fff7ed}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-day-num{font-size:12px;font-weight:700;line-height:1}
.cal-cell.weekend .cal-day-num{color:#94a3b8}
.cal-cell.holiday .cal-day-num{color:var(--warning)}
.cal-hname{font-size:8px;color:var(--warning);line-height:1.2;margin-top:1px}
.cal-entries{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.ebadge{font-size:9px;font-weight:700;padding:2px 4px;border-radius:3px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ebadge.leave_full{background:#fee2e2;color:#b91c1c}
.ebadge.leave_am{background:#fef3c7;color:#92400e}
.ebadge.leave_pm{background:#fef3c7;color:#92400e}
.ebadge.ot_full{background:#dcfce7;color:#15803d}
.ebadge.ot_am{background:#d1fae5;color:#065f46}
.ebadge.ot_pm{background:#d1fae5;color:#065f46}
.ebadge.mc{background:#f3e8ff;color:#7e22ce}

/* TIMESHEET LAYOUT */
.ts-layout{display:flex;gap:16px;align-items:flex-start}
.ts-sidebar{width:190px;flex-shrink:0;background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);position:sticky;top:120px}
.ts-sidebar h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px;letter-spacing:.3px}
.ts-main{flex:1;min-width:0}
.filter-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.filter-item:last-of-type{border-bottom:none}
.filter-item input{width:14px;height:14px;cursor:pointer;accent-color:var(--accent)}

/* LEGEND */
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px}

/* SUMMARY */
.summary-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-top:16px}
.summary-card h3{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:4px}
.wd-total{font-size:13px;color:var(--muted);margin-bottom:12px}
.wd-total strong{color:var(--primary)}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-hdr{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-hdr h3{font-size:15px;font-weight:700;color:var(--primary)}
.modal-close{background:#f1f5f9;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:20px 24px}
.modal-ftr{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}

/* TYPE BUTTONS */
.type-section{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:12px 0 6px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.type-btn{padding:9px 4px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;transition:all .2s;background:#fff;line-height:1.3}
.type-btn:hover{border-color:var(--accent)}
.type-btn.selected{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.type-btn.mc-btn{border-color:#e9d5ff;color:#7e22ce}
.type-btn.mc-btn.selected{background:#f3e8ff;border-color:#7e22ce;color:#7e22ce}

/* EXISTING ENTRIES */
.exist-entry{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#f8fafc;border-radius:8px;margin-bottom:5px;gap:8px}
.exist-entry span{font-size:12px;flex:1}

/* SECTION DIVIDER */
.sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* EXPENSE PROJECT HEADER */
.exp-proj-hdr{background:var(--primary);color:#fff;padding:12px 20px;border-radius:var(--radius) var(--radius) 0 0;font-size:14px;font-weight:700;margin:-24px -24px 0;display:flex;align-items:center;gap:8px}
.exp-tab-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.exp-tab-btn{padding:7px 18px;border-radius:20px;border:1.5px solid var(--border);background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.exp-tab-btn:hover{border-color:var(--primary);color:var(--primary)}
.exp-tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* PERSON DETAIL */
.person-link{color:var(--primary);cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:3px}
.person-link:hover{opacity:.75}
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;padding:6px 0}
.detail-back:hover{color:var(--primary)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.detail-field{padding:12px 16px;background:#f8fafc;border-radius:8px;border:1px solid var(--border)}
.detail-field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px}
.detail-field span{font-size:13px;font-weight:600;color:var(--text);word-break:break-word}
.detail-remarks{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:80px;color:var(--text);outline:none;transition:border-color .2s}
.detail-remarks:focus{border-color:var(--accent)}

/* HOURLY */
.ebadge.hours{background:#e0f2fe;color:#0369a1}
.charge-toggle{display:flex;border-radius:8px;overflow:hidden;border:1.5px solid var(--border);margin-bottom:16px}
.charge-toggle button{flex:1;padding:8px 12px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:none;color:var(--muted);font-family:inherit;transition:all .15s}
.charge-toggle button:hover{color:var(--primary)}
.charge-toggle button.ct-active{background:var(--primary);color:#fff}
.bp-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:0}
.bp-form .form-group{flex:1;min-width:140px;margin-bottom:0}
.bp-preview{padding:12px 16px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:13px;margin-top:12px;display:none}
.bp-preview.show{display:block}
.bp-stat{display:inline-block;margin-right:24px;margin-bottom:4px}
.bp-stat span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block}
.bp-stat strong{font-size:18px;color:var(--text)}
.bp-stat strong.hi{color:var(--primary)}
.po-bar-wrap{margin-top:8px}
.po-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.po-bar-fill{height:100%;background:var(--accent);border-radius:3px}

/* ALERT */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert-warn{background:#fff7ed;border:1px solid #fed7aa;color:var(--warning)}

/* RESPONSIVE */
@media(max-width:768px){
  .app-header{padding:0 16px}
  .nav{padding:0 8px}
  .page{padding:16px}
  .card{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .ts-layout{flex-direction:column}
  .ts-sidebar{width:100%;position:static}
  .cal-cell{min-height:55px}
  .ebadge{font-size:8px}
}
@media(max-width:480px){
  .cal-grid{gap:2px}
  .cal-cell{min-height:48px;padding:3px}
  .type-grid{grid-template-columns:1fr 1fr}
  .cal-day-num{font-size:11px}
}
/* SPRINT / PROJECT DETAIL */
.sprint-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.sprint-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.sprint-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-bottom:10px}
.sprint-dev-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--border)}
.proj-status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.proj-status.ps-active{background:#dcfce7;color:#15803d}
.proj-status.ps-hold{background:#fff7ed;color:#d97706}
.proj-status.ps-done{background:#eff6ff;color:#2563eb}
.toggle-group{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.toggle-btn{padding:5px 14px;font-size:12px;font-weight:600;background:transparent;border:none;cursor:pointer;color:var(--muted);transition:.15s;white-space:nowrap}
.toggle-btn:hover{color:var(--primary)}
.toggle-btn.tg-active{background:var(--accent);color:#fff}
.sprint-remarks{width:100%;min-height:58px;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;resize:vertical;background:var(--white);color:var(--text);font-family:inherit;margin-top:4px}
.sprint-remarks:focus{outline:none;border-color:var(--accent)}
.chart-wrap{position:relative;height:340px;padding:8px 0}

/* SPRINT TRACK OVERLAY */
#sprint-track-overlay{position:fixed;inset:0;background:#0a0e1a;z-index:2000;flex-direction:column;display:none}
#sprint-track-overlay.open{display:flex}
.st-hdr{background:rgba(0,0,0,.55);border-bottom:1px solid rgba(255,255,255,.1);padding:0 18px;height:50px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.st-title{color:#fff;font-size:14px;font-weight:700;flex:1}
.st-legend{display:flex;gap:8px;flex-wrap:wrap}
.st-badge{padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700}
.st-close{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.st-close:hover{background:rgba(255,255,255,.24)}
.st-body{display:flex;flex:1;overflow:hidden;min-height:0}
#sprint-track-canvas{flex:1;display:block;min-width:0;height:100%;cursor:grab}
#sprint-track-canvas:active{cursor:grabbing}
.st-board{width:210px;background:rgba(0,0,0,.72);border-left:1px solid rgba(255,255,255,.1);overflow-y:auto;padding:12px;flex-shrink:0}
.st-sb-hdr{color:#94a3b8;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.st-sb-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.st-sb-row:last-child{border:none}
.st-sb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.st-sb-name{color:#e2e8f0;font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-sb-pct{font-size:11px;font-weight:700;color:#cbd5e1;text-align:right}
.st-sb-spd{font-size:10px;color:#64748b;text-align:right}
#st-profile-panel{position:absolute;top:60px;right:220px;width:200px;background:rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px;color:#fff;z-index:10;pointer-events:auto}
.st-sb-clickable{cursor:pointer;border-radius:4px;transition:background .15s}
.st-sb-clickable:hover{background:rgba(255,255,255,.08)}
.st-ctrl{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.st-ctrl:hover{background:rgba(255,255,255,.24)}
</style>
</head>
<body>

<div class="app-header">
  <h1>⏱ Timesheet <span>Portal</span></h1>
  <button class="btn-sprint-track" onclick="openSprintTrack()">🏟 Sprint Track</button>
</div>

<nav class="nav" id="mainNav">
  <button class="nav-btn active" onclick="showTab('projects')">📁 Projects</button>
  <button class="nav-btn" onclick="showTab('profile')">👥 Profile</button>
  <button class="nav-btn" onclick="showTab('workingdays')">📅 Working Days</button>
  <button class="nav-btn" onclick="showTab('expenses')">💰 Expenses</button>
  <button class="nav-btn" onclick="showTab('timesheet')">🗓 Timesheet</button>
  <button class="nav-btn" onclick="showTab('dashboard')">📊 Dashboard</button>
</nav>

<div id="tab-projects" class="page active"></div>
<div id="tab-profile" class="page"></div>
<div id="tab-workingdays" class="page"></div>
<div id="tab-expenses" class="page"></div>
<div id="tab-timesheet" class="page"></div>
<div id="tab-dashboard" class="page"></div>

<div id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-hdr">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ftr" id="modal-ftr"></div>
  </div>
</div>

<div id="sprint-track-overlay">
  <div class="st-hdr">

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function fmtDate(ds) {
  if (!ds) return '—';
  const [y,m,d] = ds.split('-');
  return d+' '+MN[+m-1].slice(0,3)+' '+y;
}

function dk(y,m,d) {
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function isWE(y,m,d)  { const w=new Date(y,m,d).getDay(); return w===0||w===6; }
function isHol(ds)    { return !!SG_HOLIDAYS[ds]; }

function initials(name) {
  return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
}

function money(n) {
  return '$'+Number(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getRate(person, year, month) {
  if (!person.rates||!person.rates.length) return null;
  const ms = new Date(year,month,1), me = new Date(year,month+1,0);
  for (const r of person.rates) {
    const f=new Date(r.from+'T00:00:00'), t=new Date(r.to+'T00:00:00');
    if (f<=me && t>=ms) return parseFloat(r.rate)||0;
  }
  return null;
}

function calcDays(pid, year, month, totalWD) {
  let leave=0, ot=0;
  S.entries.filter(e=>{
    const [ey,em]=e.date.split('-').map(Number);
    return e.personnelId===pid && ey===year && em-1===month;
  }).forEach(e=>{
    const v=ETYPES[e.type]?.val||0;
    if(v<0) leave+=Math.abs(v); else ot+=v;
  });
  return {leave, ot, days: totalWD - leave + ot};
}

function getWD(year, month) {
  const e=S.workingDays.find(w=>w.year===year&&w.month===month);
  return e?e.days:null;
}

function getSelProjs() {
  return S.selProjs || S.projects.map(p=>p.id);
}

function workDaysInRange(startStr, endStr) {
  const s=new Date(startStr+'T00:00:00'), e=new Date(endStr+'T00:00:00');
  let n=0;
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){
    const dow=d.getDay();
    if(dow===0||dow===6) continue;
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!SG_HOLIDAYS[ds]) n++;
  }
  return n;
}

function projDevs(projectId) {
  return S.personnel.filter(p=>(p.projectIds||[]).includes(projectId)&&!p.offboard&&(p.role||'').toLowerCase().includes('developer'));
}
function projBAs(projectId) {
  return S.personnel.filter(p=>(p.projectIds||[]).includes(projectId)&&!p.offboard&&!(p.role||'').toLowerCase().includes('developer')&&(p.chargeType||'monthly')==='monthly');
}
function sprintStats(spr) {
  const devs=projDevs(spr.projectId);
  const wd=workDaysInRange(spr.startDate,spr.endDate);
  const totalH=wd*8*devs.length;
  const effectiveH=Math.round(totalH*0.8*10)/10;
  const completedH=Object.values(spr.completedHours||{}).reduce((s,v)=>s+(parseFloat(v)||0),0);
  const pct=effectiveH>0?Math.round(completedH/effectiveH*100):0;
  return {devs,wd,totalH,effectiveH,completedH,pct};
}

function drawSprintChart(sprints) {
  const canvas=document.getElementById('sprint-velocity-canvas');
  if(!canvas||typeof Chart==='undefined') return;
  const sorted=[...sprints].sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const labels=sorted.map(s=>s.name);
  const effective=sorted.map(s=>sprintStats(s).effectiveH);
  const completed=sorted.map(s=>sprintStats(s).completedH);
  const isDark=document.documentElement.getAttribute('data-theme')==='dark'||
    (!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  const fg=isDark?'#e2e8f0':'#1e293b';
  const grid=isDark?'rgba(255,255,255,.1)':'rgba(0,0,0,.08)';
  if(canvas._ci) canvas._ci.destroy();
  canvas._ci=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Effective (80%)',data:effective,backgroundColor:'rgba(99,102,241,.25)',borderColor:'#6366f1',borderWidth:2,borderRadius:4,order:1},
        {label:'Completed',data:completed,backgroundColor:'rgba(16,185,129,.7)',borderColor:'#10b981',borderWidth:1.5,borderRadius:4,order:2}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:fg,font:{size:12}}},
        tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y}h`}}
      },
      scales:{
        x:{ticks:{color:fg,font:{size:11}},grid:{color:grid}},
        y:{ticks:{color:fg,callback:v=>v+'h'},grid:{color:grid},title:{display:true,text:'Hours',color:fg,font:{size:12}}}
      }
    }
  });
}

function updateSprintPreview(projectId) {
  const start=document.getElementById('spr_start')?.value;

function delSprint(id) {

  const active    = S.personnel.filter(p=>!p.offboard);

    switch(profileSort.col) {

      case 'poUntil': return p.poUntil||'';

function showPersonDetail(id) {
  curPersonId = id;
  const p = S.personnel.find(m=>m.id===id);
  if(!p) { renderProfile(); return; }
  const projs=(p.projectIds||[]).map(pid=>{const pr=S.projects.find(x=>x.id===pid);return pr?pr.name:'?';}).join(', ')||'—';
  const isHourly=(p.chargeType||'monthly')==='hourly';
  let rateSection;
  if(isHourly){
    const hoursUsed=S.entries.filter(e=>e.personnelId===id&&e.type==='hours').reduce((s,e)=>s+(e.hours||0),0);
    const hoursLeft=(p.poHours||0)-hoursUsed;
    const pct=p.poHours?Math.min(100,Math.round(hoursUsed/p.poHours*100)):0;
    rateSection=`
    <div class="sec-label">Hourly Details</div>
    <div class="detail-grid" style="margin-bottom:12px">
      <div class="detail-field"><label>Hourly Rate</label><span><strong style="font-size:15px">${money(p.hourlyRate||0)}/hr</strong></span></div>
      <div class="detail-field"><label>PO Hours</label><span><strong>${p.poHours||0}h</strong></span></div>
      <div class="detail-field"><label>Hours Used</label><span><strong>${hoursUsed}h</strong></span></div>
      <div class="detail-field"><label>Hours Remaining</label><span><strong style="color:${hoursLeft<50?'var(--danger)':'var(--success)'}">${hoursLeft}h</strong></span></div>
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">PO Utilisation: ${pct}%</div>
      <div class="po-bar"><div class="po-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  } else {
    const rateFields=(p.rates||[]).map(r=>`<div class="detail-field">
      <label>Rate Period</label>
      <span>${fmtDate(r.from)} – ${fmtDate(r.to)}<br><strong style="font-size:15px">${money(r.rate)}/mo</strong></span>
    </div>`).join('');
    rateSection=`
    <div class="sec-label">Monthly Rates</div>
    <div class="detail-grid" style="margin-bottom:20px">${rateFields||'<p style="font-size:13px;color:var(--muted)">No rates defined.</p>'}</div>`;
  }
  document.getElementById('tab-profile').innerHTML=`
  <div><span class="detail-back" onclick="renderProfile()">← Back to Personnel List</span></div>
  <div class="card">
    <div class="card-title">
      ${p.name}
      <span class="status ${p.offboard?'status-offboard':'status-active'}" style="margin-left:4px">${p.offboard?'Offboarded':'Active'}</span>
      ${isHourly?'<span style="font-size:11px;background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:4px">Hourly</span>':''}
      <button class="btn btn-secondary btn-sm" onclick="openPersonModal('${p.id}')" style="margin-left:auto">✏ Edit</button>
    </div>
    <div class="detail-grid">
      <div class="detail-field"><label>Company</label><span>${p.company||'—'}</span></div>
      <div class="detail-field"><label>Role</label><span>${p.role||'—'}</span></div>
      <div class="detail-field"><label>Start Date</label><span>${fmtDate(p.startDate)}</span></div>
      <div class="detail-field"><label>PO Start</label><span>${fmtDate(p.poStart)}</span></div>
      <div class="detail-field"><label>PO Until</label><span>${p.poUntil?fmtDate(p.poUntil):'Open'}</span></div>
      <div class="detail-field"><label>Projects</label><span>${projs}</span></div>
      ${p.offboard?`<div class="detail-field"><label>Offboard Date</label><span>${fmtDate(p.offboardDate)}</span></div>`:''}
    </div>
    ${rateSection}
    <div class="sec-label">Remarks</div>
    <textarea class="detail-remarks" placeholder="Add notes about this person..." onblur="saveRemarks('${p.id}',this.value)">${(p.remarks||'').replace(/</g,'&lt;')}</textarea>
  </div>`;
}

function saveRemarks(id, val) {
  const p = S.personnel.find(m=>m.id===id);
  if(!p) return;
  p.remarks = val;
  save('personnel');
}

function setChargeType(type) {
  document.getElementById('f_ct').value=type;
  document.getElementById('monthly_section').style.display=type==='monthly'?'block':'none';
  document.getElementById('hourly_section').style.display=type==='hourly'?'block':'none';
  document.getElementById('ct_monthly').className=type==='monthly'?'ct-active':'';
  document.getElementById('ct_hourly').className=type==='hourly'?'ct-active':'';
}

function rateRow(r, i) {
  return `<div class="rate-entry" id="rr_${i}">
    <div class="form-group"><label>From</label><input type="date" class="r-from" value="${r.from||''}"></div>
    <div class="form-group"><label>To</label><input type="date" class="r-to" value="${r.to||''}"></div>

    <button class="btn btn-danger btn-sm" style="flex-shrink:0;align-self:flex-end" onclick="this.closest('.rate-entry').remove()">✕</button>
  </div>`;
}

function addRateRow() {
  const c=document.getElementById('ratesWrap');
  const d=document.createElement('div');
  d.innerHTML=rateRow({from:'',to:'',rate:''},c.children.length);
  c.appendChild(d.firstElementChild);
}

function toggleChip(el) { el.classList.toggle('checked'); }

function savePerson(editId) {
  const name=document.getElementById('f_name').value.trim();
  const company=document.getElementById('f_company').value.trim();
  const role=document.getElementById('f_role').value.trim();
  const startDate=document.getElementById('f_start').value;
  const poStart=document.getElementById('f_postart').value;
  const poUntil=document.getElementById('f_po').value;
  const offboard=document.getElementById('f_ob').checked;
  const offboardDate=document.getElementById('f_obdate').value;
  const chargeType=document.getElementById('f_ct').value||'monthly';

  if(!name||!company||!role) return alert('Name, Company, and Role are required.');
  if(offboard&&!offboardDate) return alert('Please enter the offboard date.');

  const projectIds=[...document.querySelectorAll('#projChips .proj-chip.checked')].map(el=>el.dataset.projid);
  const existRec=editId?S.personnel.find(p=>p.id===editId):null;

  let rates=[], hourlyRate=null, poHours=null;
  if(chargeType==='hourly'){
    const hr=parseFloat(document.getElementById('f_hrrate').value);
    const ph=parseFloat(document.getElementById('f_pohours').value);
    if(!hr||hr<=0) return alert('Please enter a valid hourly rate.');
    hourlyRate=hr;
    poHours=ph||null;
  } else {
    const rows=document.querySelectorAll('#ratesWrap .rate-entry');
    for(const row of rows){
      const from=row.querySelector('.r-from').value;
      const to=row.querySelector('.r-to').value;
      const amt=row.querySelector('.r-amt').value;
      if(!from&&!to&&!amt) continue;
      if(!from||!to||!amt) return alert('Please fill all fields for each rate period.');
      if(poUntil&&to>poUntil) return alert(`Rate end date (${fmtDate(to)}) cannot be later than PO Until (${fmtDate(poUntil)}).`);
      if(from>to) return alert('Rate "From" date cannot be after "To" date.');
      rates.push({from,to,rate:parseFloat(amt)});
    }
    if(!rates.length) return alert('Please add at least one rate period.');
    rates.sort((a,b)=>a.from.localeCompare(b.from));
  }

  const rec={
    id:editId||uid(),name,company,role,startDate,poStart,poUntil,chargeType,
    rates,hourlyRate,poHours,projectIds,offboard,offboardDate:offboard?offboardDate:null,
    remarks:existRec?existRec.remarks||'':''
  };

  if(editId){ const i=S.personnel.findIndex(p=>p.id===editId); if(i>=0) S.personnel[i]=rec; }
  else S.personnel.push(rec);
  save('personnel');
  closeModal();
  if(editId) showPersonDetail(editId); else renderProfile();
}

function delPerson(id) {
  const p=S.personnel.find(m=>m.id===id);
  if(!confirm(`Remove "${p.name}"? This will also delete their leave/OT entries.`)) return;
  S.personnel=S.personnel.filter(m=>m.id!==id);
  S.entries=S.entries.filter(e=>e.personnelId!==id);
  save('personnel'); save('entries');
  renderProfile();
}

function renderWD() {
  const years=[2026,2027,2028];
  if(!years.includes(wdYear)) wdYear=years[0];
  const cells=MN.map((mn,mi)=>{
    const wd=getWD(wdYear,mi);
    return`<div class="wd-cell${wd!==null?' wd-has':''}">
      <div class="wd-mn">${mn}</div>
      <input class="wd-inp" type="number" min="1" max="31"
        value="${wd!==null?wd:''}" placeholder="—"
        onchange="saveWDCell(${wdYear},${mi},this.value)"
        oninput="this.closest('.wd-cell').classList.toggle('wd-has',!!this.value.trim())">
    </div>`;
  }).join('');
  document.getElementById('tab-workingdays').innerHTML=`
  <div class="card">
    <div class="card-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      📅 Working Days
      <span class="wd-year-bar" style="margin-left:auto">
        ${years.map(y=>`<button class="btn ${y===wdYear?'btn-primary':'btn-ghost'} btn-sm"
          onclick="wdYear=${y};renderWD()">${y}</button>`).join('')}
      </span>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px">
      These are official number of working days declared by Govtech. Changes save automatically.
    </p>
    <div class="wd-grid">${cells}</div>
  </div>`;
}

function saveWDCell(y,m,val) {
  const d=parseInt(val);
  if(!val||!val.trim()||isNaN(d)){
    S.workingDays=S.workingDays.filter(w=>!(w.year===y&&w.month===m));
  } else if(d>=1&&d<=31){
    const i=S.workingDays.findIndex(w=>w.year===y&&w.month===m);
    if(i>=0) S.workingDays[i].days=d; else S.workingDays.push({year:y,month:m,days:d});
  }
  save('workingDays');
}

function renderExpenses() {
  const el=document.getElementById('tab-expenses');
  const months=[...S.workingDays].sort((a,b)=>b.year-a.year||b.month-a.month);

  const projsWithMembers=S.projects.filter(p=>S.personnel.some(m=>(m.projectIds||[]).includes(p.id)));
  if(!projsWithMembers.length){
    el.innerHTML=`<div class="card"><div style="text-align:center;padding:40px;color:var(--muted)">
      <p>No projects with assigned personnel found.</p>
    </div></div>`;
    return;
  }

  if(!expSelProj||!projsWithMembers.find(p=>p.id===expSelProj)){
    expSelProj=projsWithMembers[0].id;
  }

  const tabBar=`<div class="exp-tab-bar">
    ${projsWithMembers.map(p=>`<button class="exp-tab-btn${expSelProj===p.id?' active':''}" onclick="setExpProj('${p.id}')">${p.name}</button>`).join('')}
  </div>`;

  const proj=S.projects.find(p=>p.id===expSelProj);
  const members=S.personnel.filter(p=>(p.projectIds||[]).includes(proj.id));
  const monthlyMembers=members.filter(p=>(p.chargeType||'monthly')==='monthly');
  const hourlyMembers=members.filter(p=>(p.chargeType||'monthly')==='hourly');

  let tableHtml='';

  // Monthly table
  if(monthlyMembers.length){
    if(!months.length){
      tableHtml+=`<div class="card"><div class="alert alert-warn">⚠ No working days data for monthly members. Add it in the <strong>Working Days</strong> tab first.</div></div>`;
    } else {
      let rows=[];
      for(const {year,month,days} of months){
        const mStart=new Date(year,month,1), mEnd=new Date(year,month+1,0);
        for(const person of monthlyMembers){
          if(person.startDate&&new Date(person.startDate+'T00:00:00')>mEnd) continue;
          if(person.poUntil &&new Date(person.poUntil+'T00:00:00')<mStart) continue;
          const {leave,ot,days:worked}=calcDays(person.id,year,month,days);
          const rate=getRate(person,year,month);
          const cost=rate!==null?rate*(worked/days):null;
          const mEndD=new Date(year,month+1,0);
          const bp=`1 ${MN[month].slice(0,3)} ${year} – ${mEndD.getDate()} ${MN[month].slice(0,3)} ${year}`;
          rows.push({yyyymm:`${year}${String(month+1).padStart(2,'0')}`,person,days,worked,leave,ot,rate,cost,bp});
        }
      }
      tableHtml+=`<div class="card">
        <div class="exp-proj-hdr">📁 ${proj.name}</div>
        <div class="tbl-wrap" style="margin-top:16px">
          <table>
            <thead><tr><th>YYYYMM</th><th>Billing Period</th><th>Name</th><th>Company</th><th>Days Worked / Total</th><th>Monthly Rate</th><th>Cost (SGD)</th></tr></thead>
            <tbody>
              ${rows.map(r=>`<tr>
                <td>${r.yyyymm}</td>
                <td style="white-space:nowrap;font-size:12px">${r.bp}</td>
                <td><strong>${r.person.name}</strong></td>
                <td>${r.person.company}</td>
                <td>
                  <strong>${r.worked}</strong>/${r.days}
                  ${r.leave?`<span style="font-size:11px;color:var(--danger);margin-left:4px">-${r.leave}L</span>`:''}
                  ${r.ot?`<span style="font-size:11px;color:var(--success);margin-left:4px">+${r.ot}OT</span>`:''}
                </td>
                <td>${r.rate!==null?money(r.rate):'<span style="color:var(--muted)">N/A</span>'}</td>
                <td><strong>${r.cost!==null?money(r.cost):'—'}</strong></td>
              </tr>`).join('')||`<tr><td colspan="7" class="empty-row">No active members for recorded months.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
    }
  }

  // Hourly billing section
  if(hourlyMembers.length){
    const bpRows=[...S.billingPeriods.filter(bp=>hourlyMembers.some(m=>m.id===bp.personnelId))].sort((a,b)=>b.createdAt-a.createdAt);
    const bpTable=bpRows.length?`
      <div class="tbl-wrap" style="margin-top:16px">
        <table>
          <thead><tr><th>YYYYMM</th><th>Billing Period</th><th>Name</th><th>Company</th><th>Hours</th><th>Rate</th><th>Amount (SGD)</th><th></th></tr></thead>
          <tbody>
            ${bpRows.map(bp=>{
              const person=S.personnel.find(p=>p.id===bp.personnelId);
              return`<tr>
                <td>${bp.yyyymm}</td>
                <td style="white-space:nowrap;font-size:12px">${fmtDate(bp.periodStart)} – ${fmtDate(bp.periodEnd)}</td>
                <td><strong>${person?.name||'?'}</strong></td>
                <td>${person?.company||'?'}</td>
                <td><strong>${bp.totalHours}h</strong></td>
                <td>$${bp.rate}/hr</td>
                <td><strong>${money(bp.amount)}</strong></td>
                <td><button class="btn btn-danger btn-sm" onclick="delBillingPeriod('${bp.id}')">✕</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`
    :`<p style="font-size:13px;color:var(--muted);padding:12px 0">No billing periods recorded yet.</p>`;
    const personOpts=hourlyMembers.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    tableHtml+=`<div class="card">
      <div class="exp-proj-hdr">⏱ Hourly Billing</div>
      <div style="margin-top:16px">
        <div class="sec-label">Create Billing Period</div>
        <div class="bp-form">
          <div class="form-group"><label>Consultant</label>
            <select id="bp_person" onchange="updateBPPreview()">${personOpts}</select>
          </div>
          <div class="form-group"><label>Period Start</label>
            <input type="date" id="bp_start" onchange="updateBPPreview()">
          </div>
          <div class="form-group"><label>Period End</label>
            <input type="date" id="bp_end" onchange="updateBPPreview()">
          </div>
          <button class="btn btn-primary" style="flex-shrink:0;align-self:flex-end" onclick="createBillingPeriod()">Save Period</button>
        </div>
        <div class="bp-preview" id="bp_preview">
          <div class="bp-stat"><span>Hours</span><strong id="bpp_hrs" class="hi">—</strong></div>
          <div class="bp-stat"><span>Rate</span><strong id="bpp_rate">—</strong></div>
          <div class="bp-stat"><span>Amount</span><strong id="bpp_amt" class="hi">—</strong></div>
          <div class="bp-stat"><span>YYYYMM</span><strong id="bpp_yyyymm">—</strong></div>
          <div class="po-bar-wrap">
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px" id="bpp_bar_lbl">PO Utilisation</div>
            <div class="po-bar"><div class="po-bar-fill" id="bpp_bar" style="width:0%"></div></div>
          </div>
        </div>
        ${bpTable}
      </div>
    </div>`;
  }

  el.innerHTML=tabBar+tableHtml;
}

function setExpProj(id){
  expSelProj=id;
  renderExpenses();
}

function calcHours(pid, startDate, endDate) {
  return S.entries.filter(e=>e.personnelId===pid&&e.type==='hours'&&e.date>=startDate&&e.date<=endDate).reduce((s,e)=>s+(e.hours||0),0);
}

function updateBPPreview() {
  const pid=document.getElementById('bp_person')?.value;
  const start=document.getElementById('bp_start')?.value;
  const end=document.getElementById('bp_end')?.value;
  const preview=document.getElementById('bp_preview');
  if(!preview) return;
  if(!pid||!start||!end||start>end){preview.classList.remove('show');return;}
  const p=S.personnel.find(m=>m.id===pid);
  const hours=calcHours(pid,start,end);
  const rate=p?.hourlyRate||0;
  const amount=hours*rate;
  const ed=new Date(end+'T00:00:00');
  const yyyymm=`${ed.getFullYear()}${String(ed.getMonth()+1).padStart(2,'0')}`;
  const totalUsed=S.entries.filter(e=>e.personnelId===pid&&e.type==='hours').reduce((s,e)=>s+(e.hours||0),0);
  const pct=p?.poHours?Math.min(100,Math.round(totalUsed/p.poHours*100)):0;
  document.getElementById('bpp_hrs').textContent=hours+'h';
  document.getElementById('bpp_rate').textContent='$'+rate+'/hr';
  document.getElementById('bpp_amt').textContent=money(amount);
  document.getElementById('bpp_yyyymm').textContent=yyyymm;
  document.getElementById('bpp_bar_lbl').textContent=`PO: ${pct}% (${totalUsed}h of ${p?.poHours||0}h used)`;
  document.getElementById('bpp_bar').style.width=pct+'%';
  preview.classList.add('show');
}

function createBillingPeriod() {
  const pid=document.getElementById('bp_person')?.value;
  const start=document.getElementById('bp_start')?.value;
  const end=document.getElementById('bp_end')?.value;
  if(!pid||!start||!end) return alert('Please fill in all fields.');
  if(start>end) return alert('Period start must be before end.');
  const p=S.personnel.find(m=>m.id===pid);
  const hours=calcHours(pid,start,end);
  if(!hours) return alert('No hours recorded in this period for this consultant.');
  const rate=p?.hourlyRate||0;
  const amount=hours*rate;
  const ed=new Date(end+'T00:00:00');
  const yyyymm=`${ed.getFullYear()}${String(ed.getMonth()+1).padStart(2,'0')}`;
  S.billingPeriods.push({id:uid(),personnelId:pid,projectId:(p?.projectIds||[])[0]||null,periodStart:start,periodEnd:end,yyyymm,totalHours:hours,rate,amount,createdAt:Date.now()});
  save('billingPeriods');
  renderExpenses();
}

function delBillingPeriod(id) {
  if(!confirm('Remove this billing period?')) return;
  S.billingPeriods=S.billingPeriods.filter(b=>b.id!==id);
  save('billingPeriods');
  renderExpenses();
}

function renderTS() {

function toggleProjFilter(id, checked) {

function selAllProjs() {
  S.selProjs=S.projects.map(p=>p.id);
  localStorage.setItem('ts_selProjs',JSON.stringify(S.selProjs));
  renderTS();

function buildCalHTML() {
  const y=S.calYear, m=S.calMonth;
  const sel=getSelProjs();
  const calStart=new Date(y,m,1), calEnd=new Date(y,m+1,0);
  const people=S.personnel.filter(p=>{
    if(!(p.projectIds||[]).some(id=>sel.includes(id))||p.offboard) return false;
    if(!p.poStart) return false;
    if(new Date(p.poStart+'T00:00:00')>calEnd) return false;
    if(p.poUntil&&new Date(p.poUntil+'T00:00:00')<calStart) return false;
    return true;
  });
  const dim=new Date(y,m+1,0).getDate();
  const fdow=new Date(y,m,1).getDay();
  const todayStr=dk(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
  const totalWD=getWD(y,m);

  // Month entries for relevant people
  const mEntries=S.entries.filter(e=>{
    const[ey,em]=e.date.split('-').map(Number);
    return ey===y&&em-1===m&&people.some(p=>p.id===e.personnelId);
  });

  // Build cells
  let cells='';
  for(let i=0;i<fdow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=dk(y,m,d);
    const we=isWE(y,m,d), hol=isHol(ds), hn=SG_HOLIDAYS[ds]||'';
    const today=ds===todayStr;
    const de=mEntries.filter(e=>e.date===ds);
    const badges=de.slice(0,3).map(e=>{
      const pr=S.personnel.find(p=>p.id===e.personnelId);
      if(e.type==='hours'){
        return`<div class="ebadge hours" onclick="clickBadge(event,'${e.id}')" title="${pr?.name}: ${e.hours}h">${initials(pr?.name||'?')} ${e.hours}h</div>`;
      }
      const ec=ETYPES[e.type];
      return`<div class="ebadge ${ec.cls}" onclick="clickBadge(event,'${e.id}')" title="${pr?.name}: ${ec.label}">${initials(pr?.name||'?')} ${ec.short}</div>`;
    }).join('')+(de.length>3?`<div style="font-size:9px;color:var(--muted)">+${de.length-3} more</div>`:'');

    cells+=`<div class="cal-cell ${we?'weekend':''} ${hol?'holiday':''} ${today?'today':''}" onclick="openDayModal('${ds}',${we},${hol})">
      <div class="cal-day-num">${d}</div>
      ${hn?`<div class="cal-hname">${hn}</div>`:''}
      <div class="cal-entries">${badges}</div>
    </div>`;
  }

  // Summary
  let summaryHtml='';
  if(totalWD!==null){
    const mrows=people.map(p=>{
      if((p.chargeType||'monthly')==='hourly'){
        const pfx=`${y}-${String(m+1).padStart(2,'0')}`;
        const hrs=S.entries.filter(e=>e.personnelId===p.id&&e.type==='hours'&&e.date.startsWith(pfx)).reduce((s,e)=>s+(e.hours||0),0);
        return`<tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.company}</td>
          <td>${p.role||'—'}</td>
          <td><span class="ebadge hours" style="display:inline-flex">${hrs}h clocked</span></td>
        </tr>`;
      }
      const{leave,ot,days}=calcDays(p.id,y,m,totalWD);
      const parts=[];
      if(leave) parts.push(`<span style="color:var(--danger);font-size:11px">-${leave} leave</span>`);
      if(ot) parts.push(`<span style="color:var(--success);font-size:11px">+${ot} OT</span>`);
      return`<tr>
        <td><strong>${p.name}</strong></td>
        <td>${p.company}</td>
        <td>${p.role||'—'}</td>
        <td><strong>${days}</strong> / ${totalWD} ${parts.join(' ')}</td>
      </tr>`;
    }).join('');
    summaryHtml=`<div class="summary-card">
      <h3>📊 ${MN[m]} ${y} Summary</h3>
      <div class="wd-total">Total Working Days: <strong>${totalWD}</strong></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Name</th><th>Company</th><th>Role</th><th>Days / Hours</th></tr></thead>
        <tbody>${mrows||`<tr><td colspan="4" class="empty-row">No members in selected projects.</td></tr>`}</tbody>
      </table></div>
    </div>`;
  } else {
    summaryHtml=`<div class="summary-card"><div class="alert alert-warn">
      ⚠ Working days for ${MN[m]} ${y} not set. Add it in the <strong>Working Days</strong> tab.
    </div></div>`;
  }

  return`
  <div class="card">
    <div class="cal-nav">
      <button class="cal-arrow" onclick="chgMonth(-1)">‹</button>
      <h2>${MN[m]} ${y}</h2>
      <button class="cal-arrow" onclick="chgMonth(1)">›</button>
      <button class="btn btn-secondary btn-sm" onclick="goToday()">Today</button>
    </div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#fee2e2"></div>Leave</div>
      <div class="leg-item"><div class="leg-dot" style="background:#fef3c7"></div>AM/PM Leave</div>
      <div class="leg-item"><div class="leg-dot" style="background:#f3e8ff"></div>MC</div>
      <div class="leg-item"><div class="leg-dot" style="background:#dcfce7"></div>OT</div>
      <div class="leg-item"><div class="leg-dot" style="background:#fff7ed;border:1px solid #fed7aa"></div>Holiday</div>
      <div class="leg-item"><div class="leg-dot" style="background:#e0f2fe"></div>Hours</div>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  ${summaryHtml}`;
}

function chgMonth(dir){
  S.calMonth+=dir;
  if(S.calMonth>11){S.calMonth=0;S.calYear++;}
  if(S.calMonth<0){S.calMonth=11;S.calYear--;}
  localStorage.setItem('ts_calYear',S.calYear);
  localStorage.setItem('ts_calMonth',S.calMonth);
  document.getElementById('tsMain').innerHTML=buildCalHTML();
}

function goToday(){
  S.calYear=new Date().getFullYear();
  S.calMonth=new Date().getMonth();
  localStorage.setItem('ts_calYear',S.calYear);
  localStorage.setItem('ts_calMonth',S.calMonth);
  document.getElementById('tsMain').innerHTML=buildCalHTML();
}

function openDayModal(ds, isWe, isHol) {
  const sel=getSelProjs();
  const [y,m,d]=ds.split('-');
  const ym=parseInt(m)-1;
  const calStart=new Date(parseInt(y),ym,1), calEnd=new Date(parseInt(y),ym+1,0);
  const people=S.personnel.filter(p=>{
    if(!(p.projectIds||[]).some(id=>sel.includes(id))||p.offboard) return false;
    if(!p.poStart) return false;
    if(new Date(p.poStart+'T00:00:00')>calEnd) return false;
    if(p.poUntil&&new Date(p.poUntil+'T00:00:00')<calStart) return false;
    return true;
  });
  const dispDate=`${parseInt(d)} ${MN[parseInt(m)-1]} ${y}`;

  const existing=S.entries.filter(e=>e.date===ds&&people.some(p=>p.id===e.personnelId));

  const existHtml=existing.length?`
    <div style="margin-bottom:14px">
      <div class="sec-label">Entries on this day</div>
      ${existing.map(e=>{
        const pr=S.personnel.find(p=>p.id===e.personnelId);
        if(e.type==='hours'){
          return`<div class="exist-entry">
            <span><strong>${pr?.name}</strong> — <span class="ebadge hours" style="display:inline">${e.hours}h</span></span>
            <button class="btn btn-danger btn-sm" onclick="removeEntry('${e.id}','${ds}',${isWe},${isHol})">Remove</button>
          </div>`;
        }
        const ec=ETYPES[e.type];
        return`<div class="exist-entry">
          <span><strong>${pr?.name}</strong> — <span class="ebadge ${ec.cls}" style="display:inline">${ec.label}</span></span>
          <button class="btn btn-danger btn-sm" onclick="removeEntry('${e.id}','${ds}',${isWe},${isHol})">Remove</button>
        </div>`;
      }).join('')}
    </div>`:'';

  const personOpts=people.map(p=>`<option value="${p.id}">${p.name} (${p.company})</option>`).join('');

  const leaveTypeBtns=['leave_full','leave_am','leave_pm','mc'].map(t=>{
    const ec=ETYPES[t];
    return`<button class="type-btn ${t==='mc'?'mc-btn':''}" onclick="selType(this,'${t}')">${ec.label}</button>`;
  }).join('');
  const otTypeBtns=['ot_full','ot_am','ot_pm'].map(t=>{
    const ec=ETYPES[t];
    return`<button class="type-btn" onclick="selType(this,'${t}')">${ec.label}</button>`;
  }).join('');

  const firstPerson=people[0];
  const firstIsHourly=firstPerson&&(firstPerson.chargeType||'monthly')==='hourly';

  document.getElementById('modal-title').textContent=`📅 ${dispDate}`;
  document.getElementById('modal-body').innerHTML=`
    ${existHtml}
    ${people.length===0?`<p style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0">No personnel in selected projects.</p>`:`
    <div>
      <div class="sec-label">Add Entry</div>
      <div class="form-group">
        <label>Personnel</label>
        <select id="ep_person" onchange="toggleEntryForm(this.value)">${personOpts}</select>
      </div>
      <div id="monthly_entry_form" style="display:${firstIsHourly?'none':'block'}">
        ${!isWe&&!isHol?`<div class="type-section">Leave / MC</div><div class="type-grid" style="grid-template-columns:repeat(4,1fr)">${leaveTypeBtns}</div>`:''}
        <div class="type-section">Overtime</div>
        <div class="type-grid">${otTypeBtns}</div>
      </div>
      <div id="hourly_entry_form" style="display:${firstIsHourly?'block':'none'}">
        <div class="form-group" style="margin-top:8px">
          <label>Hours Worked</label>
          <input type="number" id="ep_hours" placeholder="e.g. 8" min="0" max="24" step="0.5" style="width:100%">
        </div>
      </div>
      <input type="hidden" id="ep_type" value="">
      <input type="hidden" id="ep_date" value="${ds}">
    </div>`}
  `;
  document.getElementById('modal-ftr').innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    ${people.length>0?`<button class="btn btn-primary" onclick="addEntry()">Add Entry</button>`:''}
  `;
  openModal();
}

function selType(btn,type){
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('ep_type').value=type;
}

function toggleEntryForm(pid) {
  const p=S.personnel.find(m=>m.id===pid);
  const isH=(p?.chargeType||'monthly')==='hourly';
  const mf=document.getElementById('monthly_entry_form');
  const hf=document.getElementById('hourly_entry_form');
  if(mf) mf.style.display=isH?'none':'block';
  if(hf) hf.style.display=isH?'block':'none';
}

function addEntry(){
  const pid=document.getElementById('ep_person').value;
  const date=document.getElementById('ep_date').value;
  const p=S.personnel.find(m=>m.id===pid);
  const isH=(p?.chargeType||'monthly')==='hourly';
  if(isH){
    const hours=parseFloat(document.getElementById('ep_hours')?.value||0);
    if(!hours||hours<=0) return alert('Please enter valid hours worked.');
    S.entries=S.entries.filter(e=>!(e.personnelId===pid&&e.date===date&&e.type==='hours'));
    S.entries.push({id:uid(),personnelId:pid,date,type:'hours',hours});
  } else {
    const type=document.getElementById('ep_type').value;
    if(!type) return alert('Please select a type.');
    if(S.entries.find(e=>e.personnelId===pid&&e.date===date&&e.type===type))
      return alert('This entry already exists for this person on this date.');
    S.entries.push({id:uid(),personnelId:pid,date,type});
  }
  save('entries');
  closeModal();
  document.getElementById('tsMain').innerHTML=buildCalHTML();
}

function removeEntry(id,ds,isWe,isHol){
  S.entries=S.entries.filter(e=>e.id!==id);
  save('entries');
  closeModal();
  setTimeout(()=>{
    if(document.getElementById('tsMain'))
      document.getElementById('tsMain').innerHTML=buildCalHTML();
    openDayModal(ds,isWe,isHol);
  },50);
}

function clickBadge(evt, id){
  evt.stopPropagation();
  if(confirm('Remove this entry?')){
    S.entries=S.entries.filter(e=>e.id!==id);
    save('entries');
    document.getElementById('tsMain').innerHTML=buildCalHTML();
  }
}

function setDashFilter(key, val) {

  else dashSelVar=val;
  renderDashboard();

function dashProjIds() {
  return dashSelProj ? [dashSelProj] : S.projects.map(p=>p.id);
}

function dashExpenseRows(projIds) {
  const rows=[];
  const months=[...S.workingDays].sort((a,b)=>a.year-b.year||a.month-b.month);
  for(const pid of projIds) {
    const proj=S.projects.find(p=>p.id===pid); if(!proj) continue;
    const members=S.personnel.filter(p=>(p.projectIds||[]).includes(pid));
    const monthly=members.filter(p=>(p.chargeType||'monthly')==='monthly');
    const hourly=members.filter(p=>p.chargeType==='hourly');
    for(const {year,month,days} of months) {
      const mStart=new Date(year,month,1), mEnd=new Date(year,month+1,0);
      for(const per of monthly) {
        if(per.startDate&&new Date(per.startDate+'T00:00:00')>mEnd) continue;
        if(per.poUntil &&new Date(per.poUntil+'T00:00:00')<mStart) continue;
        const {leave,ot,days:worked}=calcDays(per.id,year,month,days);
        const rate=getRate(per,year,month);
        const cost=rate!==null?rate*(worked/days):null;
        const yyyymm=`${year}${String(month+1).padStart(2,'0')}`;
        const mEndD=new Date(year,month+1,0);
        const bp=`1 ${MN[month].slice(0,3)} ${year} – ${mEndD.getDate()} ${MN[month].slice(0,3)} ${year}`;
        rows.push({yyyymm,bp,proj,per,type:'Monthly',detail:`${worked}/${days} days`,rate:rate!==null?money(rate):'—',amount:cost});
      }
    }
    const bps=S.billingPeriods.filter(b=>hourly.some(h=>h.id===b.personnelId)).sort((a,b)=>a.yyyymm.localeCompare(b.yyyymm));
    for(const b of bps) {
      const per=S.personnel.find(p=>p.id===b.personnelId);
      const bpProj=S.projects.find(p=>p.id===b.projectId)||proj;
      if(!projIds.includes(bpProj.id)&&!projIds.includes(b.projectId)) continue;
      rows.push({yyyymm:b.yyyymm,bp:`${fmtDate(b.periodStart)} – ${fmtDate(b.periodEnd)}`,proj:bpProj,per,type:'Hourly',detail:`${b.totalHours}h @ $${b.rate}/hr`,rate:`$${b.rate}/hr`,amount:b.amount});
    }
  }
  rows.sort((a,b)=>b.yyyymm.localeCompare(a.yyyymm));
  return rows;
}

function dashVelocityRows(projIds) {
  return S.sprints
    .filter(s=>projIds.includes(s.projectId))
    .map(s=>{const st=sprintStats(s);const proj=S.projects.find(p=>p.id===s.projectId);return{s,st,proj};})
    .sort((a,b)=>b.s.startDate.localeCompare(a.s.startDate));
}

              <td style="font-size:12px;white-space:nowrap">${fmtDate(s.endDate)}</td>
              <td style="text-align:center">${st.wd}</td>
              <td style="text-align:center">${st.totalH}h</td>
              <td style="text-align:center">${st.effectiveH}h</td>
              <td style="text-align:center;color:${pc};font-weight:700">${st.completedH}h</td>
              <td><div style="display:flex;align-items:center;gap:6px">
                <div class="po-bar" style="flex:1;margin:0"><div class="po-bar-fill" style="width:${Math.min(100,st.pct)}%;background:${pc}"></div></div>
                <span style="font-size:11px;font-weight:700;color:${pc};min-width:32px;text-align:right">${st.pct}%</span>
              </div></td>
            </tr>`;
          }).join('')||`<tr><td colspan="9" class="empty-row">No sprints ending in ${recentLabel}.</td></tr>`}
        </tbody>
      </table></div>
    </div>`;
  }

  el.innerHTML=filterBar+chartCard+expHtml+velHtml;
  setTimeout(()=>drawDashCombinedChart(expRows,velRows,projIds),0);
}

function dashChartTheme() {
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||
    (!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  return {fg:dark?'#e2e8f0':'#1e293b', grid:dark?'rgba(255,255,255,.1)':'rgba(0,0,0,.07)'};
}

function drawDashCombinedChart(expRows, velRows, projIds) {
  const canvas=document.getElementById('dash-combined-chart');
  if(!canvas) return;
  if(typeof Chart==='undefined'){
    canvas.parentElement.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px">⚠️ Chart library failed to load. Check your internet connection.</div>';
    return;
  }
  const {fg,grid}=dashChartTheme();
  const MTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Monthly expenses by YYYYMM
  const expByYM={};
  expRows.forEach(r=>{expByYM[r.yyyymm]=(expByYM[r.yyyymm]||0)+(r.amount||0);});

  // Sort sprints by end date ascending
  const sortedSprints=[...velRows].sort((a,b)=>a.s.endDate.localeCompare(b.s.endDate));

  if(!sortedSprints.length&&!Object.keys(expByYM).length){
    if(canvas._ci){canvas._ci.destroy();canvas._ci=null;}
    canvas.parentElement.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px">No data to display</div>';
    return;
  }

  let labels,expData,velData;
  if(sortedSprints.length){
    // Per-sprint x-axis: "12 Sep '26" — each sprint is a unique data point
    // Expense bar shows monthly total only on the first sprint of each month (0 for subsequent)
    const seenMonths=new Set();
    labels=sortedSprints.map(({s})=>{
      const[y,m,d]=s.endDate.split('-');
      return d+' '+MTHS[parseInt(m,10)-1]+" '"+y.slice(2);
    });
    expData=sortedSprints.map(({s})=>{
      const[y,m]=s.endDate.split('-');const ym=y+m;
      if(seenMonths.has(ym))return 0;
      seenMonths.add(ym);return expByYM[ym]||0;
    });
    velData=sortedSprints.map(({st})=>st.completedH||null);
  } else {
    const periods=Object.keys(expByYM).sort();
    labels=periods.map(ym=>MTHS[parseInt(ym.slice(4,6),10)-1]+" '"+ym.slice(2,4));
    expData=periods.map(ym=>expByYM[ym]||0);
    velData=periods.map(()=>null);
  }

  if(canvas._ci){try{canvas._ci.destroy();}catch(e){}}
  canvas._ci=null;
  try{canvas._ci=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'bar',label:'Expenses (SGD)',data:expData,
          backgroundColor:'rgba(99,102,241,0.5)',borderColor:'#6366f1',
          borderWidth:1.5,borderRadius:4,yAxisID:'y',order:2},
        {type:'line',label:'Sprint Velocity (hrs)',data:velData,
          borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.1)',
          borderWidth:2.5,pointRadius:5,pointHoverRadius:7,pointBackgroundColor:'#10b981',
          tension:0.3,fill:false,yAxisID:'y1',spanGaps:false,order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:fg,font:{size:11}}},
        tooltip:{callbacks:{label:ctx=>ctx.dataset.yAxisID==='y1'
          ?`${ctx.dataset.label}: ${ctx.parsed.y}h`
          :`${ctx.dataset.label}: $${Number(ctx.parsed.y).toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:0})}`}}
      },
      scales:{
        x:{ticks:{color:fg,font:{size:10},maxRotation:45,minRotation:30},grid:{color:grid}},
        y:{type:'linear',position:'left',
          ticks:{color:'#6366f1',callback:v=>'$'+(v>=1000?(v/1000).toFixed(0)+'k':v)},
          grid:{color:grid},
          title:{display:true,text:'Expenses (SGD)',color:'#6366f1',font:{size:11}}},
        y1:{type:'linear',position:'right',
          ticks:{color:'#10b981',callback:v=>v+'h'},
          grid:{drawOnChartArea:false},
          title:{display:true,text:'Velocity (hrs)',color:'#10b981',font:{size:11}}}
      }
    }
  });}catch(err){
    canvas.parentElement.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px">Chart error: '+err.message+'</div>';
  }
}

function _stPhysique(pct){
  if(pct<=50) return{tR:.22,tH:.46,tB:.20,legL:.36,armL:.30,hdR:.18,label:'Obese'};
  if(pct<=60) return{tR:.19,tH:.44,tB:.17,legL:.37,armL:.30,hdR:.165,label:'Chubby'};
  if(pct<=75) return{tR:.155,tH:.43,tB:.13,legL:.38,armL:.32,hdR:.155,label:'Average'};
  return            {tR:.13,tH:.43,tB:.10,legL:.40,armL:.34,hdR:.14,label:'Muscular'};
}

function _stIsBA(per){return(per.role||'').toLowerCase().startsWith('ba')||per.chargeType==='hourly';}

function _stSetCam(){if(!_stCam)return;_stCam.position.set(_stPanX,_stCamH,_stPanZ+_stCamD);_stCam.lookAt(_stPanX,0,_stPanZ);}

function _stResetCam(){_stPanX=0;_stPanZ=0;_stCamH=22;_stCamD=24;_stSetCam();}

function _stToggleNames(){

  _stObjs.forEach(d=>{if(d.label)d.label.visible=_stShowNames;});

}

function _stTogglePause(){

  if(btn)btn.textContent=_stPaused?'▶':'⏸';
