<!DOCTYPE html>
<title>Sprint Track V5 — Stage 2 Stadium Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08111E;font-family:Inter,system-ui,sans-serif}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#badge{position:fixed;top:0;left:0;display:flex;align-items:center;gap:8px;
  background:rgba(14,14,10,.85);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-top:none;border-left:none;
  color:#F0EDE8;font-size:12px;font-weight:600;letter-spacing:.04em;
  padding:9px 16px;border-radius:0 0 10px 0;pointer-events:none;z-index:10}
.live{width:8px;height:8px;border-radius:50%;background:#3DAA60;animation:p 1.8s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
#zoom{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:10}
.zb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(14,14,10,.82);backdrop-filter:blur(10px);
  color:#E8E4DC;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s}
.zb:hover{background:rgba(50,48,40,.9)}
#hint{position:fixed;bottom:22px;left:22px;background:rgba(14,14,10,.75);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
  color:#888078;font-size:11px;padding:7px 12px;border-radius:7px;pointer-events:none;line-height:1.65;z-index:10}
#legend{position:fixed;top:54px;left:14px;background:rgba(14,14,10,.75);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
  color:#C0B8A8;font-size:11px;padding:10px 14px;border-radius:8px;pointer-events:none;z-index:10;line-height:1.8}
.lsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
#dbg{position:fixed;top:120px;left:14px;right:14px;z-index:99;color:#FFCC44;font-size:11px;
  background:rgba(0,0,0,.92);padding:10px 14px;border-radius:8px;font-family:monospace;
  line-height:1.7;display:none;word-break:break-all;border:1px solid rgba(255,204,68,.3)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 60%, transparent 55%, rgba(8,17,30,0.75) 100%)}
</style>

<canvas id="c"></canvas>
<div id="badge"><span class="live"></span>Stage 2 · Phase 3 · Dusk Diorama Preview</div>
<div id="zoom">
  <button class="zb" id="zin">+</button>
  <button class="zb" id="zout">−</button>
  <button class="zb" id="zrst" title="Reset" style="font-size:13px;letter-spacing:0">↺</button>
  <button class="zb" id="cprev" title="Character Preview" style="font-size:10px;font-weight:700;letter-spacing:0">CHAR</button>
</div>
<div id="hint">Drag to pan &nbsp;·&nbsp; Scroll or pinch to zoom &nbsp;·&nbsp; ↺ Reset</div>
<div id="legend">
  <div><span class="lsw" style="background:#C65B42"></span>Running Track</div>
  <div><span class="lsw" style="background:#477B36"></span>Infield Grass</div>
  <div><span class="lsw" style="background:#3D4146"></span>Grandstands</div>
  <div><span class="lsw" style="background:#F472B6"></span>ORION · <span class="lsw" style="background:#38BDF8"></span>POLARIS · <span class="lsw" style="background:#FACC15"></span>CORDIS</div>
</div>
<div id="vignette"></div>
<div id="dbg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

const DBG = document.getElementById('dbg');
function log(msg) { DBG.style.display = 'block'; DBG.innerHTML += msg + '<br>'; }
function err(msg)  { DBG.style.display = 'block'; DBG.style.color = '#FF6060'; DBG.innerHTML += '⚠ ' + msg + '<br>'; }

let _inited = false;
function tryInit() {
  if (_inited) return;
  _inited = true;

  try {
    log('readyState: ' + document.readyState);

    if (typeof THREE === 'undefined') {
      err('THREE.js not loaded — CDN may be blocked');
      return;
    }
    log('THREE r' + THREE.REVISION + ' loaded');

    const canvas = document.getElementById('c');
    const cW = Math.max(200, canvas.clientWidth  || window.innerWidth  || document.documentElement.clientWidth  || 375);
    const cH = Math.max(200, canvas.clientHeight || window.innerHeight || document.documentElement.clientHeight || 667);
    log('canvas: ' + cW + '×' + cH);

    const testGL = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!testGL) { err('WebGL not available'); return; }
    log('WebGL OK');

    // ─── RENDERER ───────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({antialias:true, canvas});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(cW, cH, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    // LinearEncoding (default) — r134 does not auto-convert hex material colors
    // to linear, so sRGBEncoding would gamma-brighten every colour and wash them out.

    // ─── SCENE ──────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08111E);
    scene.fog = new THREE.Fog(0x08111E, 55, 130);

    // ─── CAMERA ─────────────────────────────────────────────────────────────
    const CAM_POS_DEFAULT = new THREE.Vector3(16, 26, 38);
    const CAM_TGT_DEFAULT = new THREE.Vector3(0, 0, -6);
    const camera = new THREE.PerspectiveCamera(44, cW/cH, 0.1, 200);
    camera.position.copy(CAM_POS_DEFAULT);

    // ─── ORBIT CONTROLS (pan + zoom only, no rotation) ──────────────────────
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(CAM_TGT_DEFAULT);
    controls.enableRotate       = false;
    controls.enablePan          = true;
    controls.enableZoom         = true;
    controls.screenSpacePanning = false; // pan along XZ ground plane (map style)
    controls.mouseButtons = {
      LEFT:   THREE.MOUSE.PAN,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT:  THREE.MOUSE.PAN
    };
    controls.touches = {
      ONE: THREE.TOUCH.PAN,
      TWO: THREE.TOUCH.DOLLY_PAN
    };
    controls.minDistance = 12;
    controls.maxDistance = 80;
    controls.panSpeed    = 1.4;
    controls.zoomSpeed   = 1.2;
    controls.update();

    // Character preview mode
    let charPreview=false;
    const CAM_CHAR_POS=new THREE.Vector3(0,2.4,7.2);
    const CAM_CHAR_TGT=new THREE.Vector3(0,1.3,0.5);

    // ─── LIGHTING ───────────────────────────────────────────────────────────
    // Warm evening dusk atmosphere
    scene.add(new THREE.AmbientLight(0x111828, 0.20));
    scene.add(new THREE.HemisphereLight(0xFFCC88, 0x1A2210, 0.48));

    // Warm amber late-afternoon sun from stadium side
    const sun = new THREE.DirectionalLight(0xFFBB55, 1.9);
    sun.position.set(22, 20, 32);
    sun.castShadow = true;
    sun.shadow.mapSize.width  = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.bias = -0.002;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far  = 120;
    sun.shadow.camera.left   = -50;
    sun.shadow.camera.right  =  50;
    sun.shadow.camera.top    =  50;
    sun.shadow.camera.bottom = -50;
    scene.add(sun);

    // Cool blue fill for dusk shadow depth
    const fill = new THREE.DirectionalLight(0x4466BB, 0.28);
    fill.position.set(-25, 15, -18);
    scene.add(fill);

    // ─── TRACK CONSTANTS ────────────────────────────────────────────────────
    const SL  = 9;    // half-length of straights (X axis)
    const TR  = 5.0;  // inner track radius at curves
    const LW  = 0.55; // lane width
    const NL  = 8;    // number of lanes
    const OTR = TR + NL * LW; // outer track radius = 9.4

    // ─── GRANDSTAND CONSTANTS ───────────────────────────────────────────────
    const CLEARANCE = 1.5;
    const GS_INNER  = OTR + CLEARANCE; // = 10.9
    const TIERS  = 7;
    const TIER_W = 1.3;
    const TIER_H = 0.70;

    // ─── MATERIALS ──────────────────────────────────────────────────────────
    const MAT = {
      grass:    new THREE.MeshStandardMaterial({color:0x406E2A, roughness:0.94, metalness:0}),
      infield:  new THREE.MeshStandardMaterial({color:0x477B36, roughness:0.92, metalness:0}),
      track:    new THREE.MeshStandardMaterial({color:0xC65B42, roughness:0.78, metalness:0}),
      concrete: new THREE.MeshStandardMaterial({color:0x3D4146, roughness:0.85, metalness:0.01}),
      concrete2:new THREE.MeshStandardMaterial({color:0x4B5158, roughness:0.87, metalness:0.01}),
      warm:     new THREE.MeshStandardMaterial({color:0x827A70, roughness:0.82, metalness:0.01}),
      roof:     new THREE.MeshStandardMaterial({color:0x5C6065, roughness:0.60, metalness:0.15, transparent:true, opacity:0.92}),
      steel:    new THREE.MeshStandardMaterial({color:0x555A60, roughness:0.40, metalness:0.75}),
      led:      new THREE.MeshStandardMaterial({color:0x111114, roughness:0.6, emissive:0x0033FF, emissiveIntensity:0.18}),
      scoreGlow:new THREE.MeshStandardMaterial({color:0x080808, roughness:0.5, emissive:0xFF8800, emissiveIntensity:0.5}),
      white:    new THREE.MeshStandardMaterial({color:0xF5E9D9, roughness:0.6}),
      sand:     new THREE.MeshStandardMaterial({color:0xD4C080, roughness:0.96}),
      foam:     new THREE.MeshStandardMaterial({color:0x3A7FBF, roughness:0.88}),
      flagRed:  new THREE.MeshStandardMaterial({color:0xE03028, roughness:0.7, side:THREE.DoubleSide}),
      flagYel:  new THREE.MeshStandardMaterial({color:0xF4C020, roughness:0.7, side:THREE.DoubleSide}),
    };

    function addShadow(m) { m.castShadow = true; m.receiveShadow = true; return m; }

    // ─── GEOMETRY HELPERS ───────────────────────────────────────────────────
    function stadiumFillGeo(sl, r) {
      const s = new THREE.Shape();
      s.absarc( sl, 0, r, -Math.PI/2,  Math.PI/2, false);
      s.lineTo(-sl, r);
      s.absarc(-sl, 0, r,  Math.PI/2, 3*Math.PI/2, false);
      s.lineTo( sl, -r);
      const g = new THREE.ShapeGeometry(s, 40);
      g.rotateX(-Math.PI/2);
      return g;
    }

    function stadiumRingGeo(sl, outerR, innerR) {
      const outer = new THREE.Shape();
      outer.absarc( sl, 0, outerR, -Math.PI/2,  Math.PI/2, false);
      outer.lineTo(-sl, outerR);
      outer.absarc(-sl, 0, outerR,  Math.PI/2, 3*Math.PI/2, false);
      outer.lineTo( sl, -outerR);
      const hole = new THREE.Path();
      hole.absarc( sl, 0, innerR, -Math.PI/2,  Math.PI/2, false);
      hole.lineTo(-sl, innerR);
      hole.absarc(-sl, 0, innerR,  Math.PI/2, 3*Math.PI/2, false);
      hole.lineTo( sl, -innerR);
      outer.holes.push(hole);
      const g = new THREE.ShapeGeometry(outer, 40);
      g.rotateX(-Math.PI/2);
      return g;
    }

    function qRingR(outerR, innerR) {
      const s = new THREE.Shape();
      s.absarc(SL, 0, outerR, 0, Math.PI/2, false);
      s.absarc(SL, 0, innerR, Math.PI/2, 0, true);
      const g = new THREE.ShapeGeometry(s, 16);
      g.rotateX(-Math.PI/2);
      return g;
    }

    function qRingL(outerR, innerR) {
      const s = new THREE.Shape();
      s.absarc(-SL, 0, outerR, Math.PI/2, Math.PI, false);
      s.absarc(-SL, 0, innerR, Math.PI, Math.PI/2, true);
      const g = new THREE.ShapeGeometry(s, 16);
      g.rotateX(-Math.PI/2);
      return g;
    }

    // ─── ARC-LENGTH TRACK POSITION ─────────────────────────────────────────
    // Counter-clockwise from above: front straight (-X) → left curve → back straight (+X) → right curve
    function trackPos(s, lR) {
      const P      = 4 * SL + 2 * Math.PI * lR;
      const d      = ((s % 1) + 1) % 1 * P;
      const arcLen = Math.PI * lR;
      const e1 = 2 * SL;            // end of front straight
      const e2 = e1 + arcLen;       // end of left curve
      const e3 = e2 + 2 * SL;       // end of back straight
      // e4 = e3 + arcLen = P        end of right curve

      let x, z, ry;
      if (d < e1) {
        // Front straight: (+SL, +lR) → (-SL, +lR), moving -X
        const f = d / (2 * SL);
        x = SL - f * 2 * SL;
        z = lR;
        ry = -Math.PI / 2;
      } else if (d < e2) {
        // Left curve: center (-SL, 0), theta PI/2 → 3PI/2 (CCW from above)
        const theta = Math.PI / 2 + (d - e1) / arcLen * Math.PI;
        x = -SL + lR * Math.cos(theta);
        z =        lR * Math.sin(theta);
        ry = Math.atan2(-Math.sin(theta), Math.cos(theta));
      } else if (d < e3) {
        // Back straight: (-SL, -lR) → (+SL, -lR), moving +X
        const f = (d - e2) / (2 * SL);
        x = -SL + f * 2 * SL;
        z = -lR;
        ry = Math.PI / 2;
      } else {
        // Right curve: center (+SL, 0), theta -PI/2 → PI/2
        const theta = -Math.PI / 2 + (d - e3) / arcLen * Math.PI;
        x = SL + lR * Math.cos(theta);
        z =       lR * Math.sin(theta);
        ry = Math.atan2(-Math.sin(theta), Math.cos(theta));
      }
      return { x, z, ry };
    }

    // pct → per-frame arc fraction (speed rules)
    function pctToSpeed(pct) {
      if (pct <= 0)    return 0;
      if (pct < 0.50)  return 0.00055 * (pct / 0.50);
      if (pct < 0.60)  return 0.00055 + (pct - 0.50) / 0.10 * 0.00055;
      if (pct < 0.75)  return 0.00110 + (pct - 0.60) / 0.15 * 0.00090;
      if (pct < 0.85)  return 0.00200 + (pct - 0.75) / 0.10 * 0.00110;
      return 0.00310 + (pct - 0.85) / 0.15 * 0.00140;
    }

    // ─── GROUND + DIORAMA PLATFORM ──────────────────────────────────────────
    const gnd = new THREE.Mesh(new THREE.PlaneGeometry(62, 38), MAT.grass);
    gnd.rotation.x = -Math.PI/2; gnd.position.set(0, 0, -4); gnd.receiveShadow = true; scene.add(gnd);

    // Miniature diorama wooden base platform
    const woodMat = new THREE.MeshStandardMaterial({color:0x4A2E12, roughness:0.78, metalness:0.01});
    const rimMat  = new THREE.MeshStandardMaterial({color:0x7A4828, roughness:0.72, metalness:0.01});
    const platform = addShadow(new THREE.Mesh(new THREE.BoxGeometry(62, 2.6, 38), woodMat));
    platform.position.set(0, -1.3, -4); scene.add(platform);
    const rimF = addShadow(new THREE.Mesh(new THREE.BoxGeometry(62.4, 0.22, 0.30), rimMat));
    rimF.position.set(0, 0.04, 15.15); scene.add(rimF);
    const rimBk = addShadow(new THREE.Mesh(new THREE.BoxGeometry(62.4, 0.22, 0.30), rimMat));
    rimBk.position.set(0, 0.04, -23.15); scene.add(rimBk);
    const rimL = addShadow(new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.22, 38.4), rimMat));
    rimL.position.set(-31.15, 0.04, -4); scene.add(rimL);
    const rimR = addShadow(new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.22, 38.4), rimMat));
    rimR.position.set(31.15, 0.04, -4); scene.add(rimR);

    const apron = new THREE.Mesh(stadiumRingGeo(SL, OTR + 1.2, OTR), MAT.warm);
    apron.position.y = 0.01; apron.receiveShadow = true; scene.add(apron);

    // ─── RUNNING TRACK ──────────────────────────────────────────────────────
    const track = new THREE.Mesh(stadiumRingGeo(SL, OTR, TR), MAT.track);
    track.position.y = 0.02; track.receiveShadow = true; scene.add(track);

    for (let ln = 0; ln <= NL; ln++) {
      const r = TR + ln * LW;
      const line = new THREE.Mesh(stadiumRingGeo(SL, r + 0.025, r), MAT.white);
      line.position.y = 0.035; scene.add(line);
    }

    const sfLine = new THREE.Mesh(new THREE.BoxGeometry(NL * LW + 0.1, 0.01, 0.1), MAT.white);
    sfLine.position.set(SL - 0.5, 0.04, 0); scene.add(sfLine);

    // ─── INFIELD ────────────────────────────────────────────────────────────
    const infield = new THREE.Mesh(stadiumFillGeo(SL, TR), MAT.infield);
    infield.position.y = 0.03; infield.receiveShadow = true; scene.add(infield);

    // ─── U-SHAPED GRANDSTAND ────────────────────────────────────────────────
    for (let t = 0; t < TIERS; t++) {
      const ri = GS_INNER + t * TIER_W;
      const ro = GS_INNER + (t + 1) * TIER_W;
      const ty = t * TIER_H + 0.01;
      const tm = t % 2 === 0 ? MAT.concrete : MAT.concrete2;

      const rsb = addShadow(new THREE.Mesh(new THREE.BoxGeometry(2 * SL, TIER_H, TIER_W), tm));
      rsb.position.set(0, ty + TIER_H * 0.5, -(ri + TIER_W * 0.5));
      scene.add(rsb);

      const rw = addShadow(new THREE.Mesh(qRingR(ro, ri), tm));
      rw.position.y = ty + TIER_H * 0.5; scene.add(rw);

      const lw = addShadow(new THREE.Mesh(qRingL(ro, ri), tm));
      lw.position.y = ty + TIER_H * 0.5; scene.add(lw);
    }

    const bkW = addShadow(new THREE.Mesh(
      new THREE.BoxGeometry(2*SL, TIERS*TIER_H, 0.28), MAT.concrete));
    bkW.position.set(0, TIERS*TIER_H*0.5, -(GS_INNER + TIERS*TIER_W));
    scene.add(bkW);

    const rfMesh = addShadow(new THREE.Mesh(
      new THREE.BoxGeometry(2*SL + 2, 0.2, TIERS*TIER_W + 0.8), MAT.roof));
    rfMesh.position.set(0, TIERS*TIER_H + 1.75, -(GS_INNER + TIERS*TIER_W*0.5));
    scene.add(rfMesh);

    for (let c = 0; c <= 4; c++) {
      const cx = SL * (c/2 - 1);
      const col = addShadow(new THREE.Mesh(
        new THREE.CylinderGeometry(0.13, 0.17, TIERS*TIER_H + 1.9, 8), MAT.steel));
      col.position.set(cx, (TIERS*TIER_H + 1.9)*0.5, -(GS_INNER + TIERS*TIER_W + 0.4));
      scene.add(col);
    }

    // ─── GRANDSTAND SEAT DETAILING ──────────────────────────────────────────
    const SEAT_BAND = [0x4A7AB5, 0xB84840, 0x3A9858, 0xB09030, 0x904AB0, 0x5080C0, 0x409868];
    for (let t = 0; t < TIERS; t++) {
      const ri = GS_INNER + t * TIER_W;
      const ty = t * TIER_H;
      const sbMat = new THREE.MeshStandardMaterial({color: SEAT_BAND[t % SEAT_BAND.length], roughness:0.88});
      const sf = new THREE.Mesh(new THREE.BoxGeometry(2*SL - 0.1, TIER_H * 0.72, 0.07), sbMat);
      sf.position.set(0, ty + TIER_H * 0.5, -ri + 0.04); scene.add(sf);
      const hr = new THREE.Mesh(new THREE.BoxGeometry(2*SL + 0.2, 0.055, 0.055), MAT.steel);
      hr.position.set(0, ty + TIER_H + 0.04, -ri); scene.add(hr);
    }
    const baseWall = addShadow(new THREE.Mesh(
      new THREE.BoxGeometry(2*SL + 0.5, 0.65, 0.22), MAT.concrete));
    baseWall.position.set(0, 0.33, -GS_INNER + 0.11); scene.add(baseWall);

    // ─── SPECTATORS ─────────────────────────────────────────────────────────
    const SCOLS = [0xE03428,0x3478D8,0xE8C030,0x28A848,0xE070B0,0x8860D8,0xE86020,0xD4D0C0,
                   0xFFFFFF,0x222244,0xF08020,0x20A090,0xE840A0,0x60B040,0x6040C8,0xC8A020];
    const bGeo = new THREE.CylinderGeometry(0.06,0.075,0.24,7);
    const hGeo = new THREE.SphereGeometry(0.095,8,6);
    const aGeo = new THREE.BoxGeometry(0.28,0.065,0.065);
    const NC = SCOLS.length;
    const SD = 0.26;

    let totalSpec = 0;
    for (let t = 0; t < TIERS; t++) {
      const rc = GS_INNER + t*TIER_W + TIER_W*0.5;
      totalSpec += Math.floor(2*SL/SD) + 2*Math.floor(Math.PI/2*rc/SD);
    }
    const perC = Math.ceil(totalSpec/NC);
    const bMs = SCOLS.map(c=>new THREE.InstancedMesh(bGeo, new THREE.MeshStandardMaterial({color:c,roughness:0.75}), perC));
    const hMs = SCOLS.map(()=>new THREE.InstancedMesh(hGeo, new THREE.MeshStandardMaterial({color:0xE8C090,roughness:0.65}), perC));
    const aMs = SCOLS.map(c=>new THREE.InstancedMesh(aGeo, new THREE.MeshStandardMaterial({color:c,roughness:0.80}), perC));
    const sc = new Array(NC).fill(0), dm = new THREE.Object3D();

    for (let t = 0; t < TIERS; t++) {
      const ri = GS_INNER + t*TIER_W;
      const rc = ri + TIER_W*0.5;
      const ty = t*TIER_H + TIER_H + 0.12;
      const nR = Math.floor(2*SL/SD);
      for (let i = 0; i < nR; i++) {
        if (i%18===8||i%18===9) continue;
        const x = -SL + (i+0.5)*(2*SL/nR);
        const z = -rc;
        const ci = Math.abs(i*7+t*3)%NC, idx = sc[ci]++;
        if (idx>=perC) continue;
        dm.position.set(x,ty,z); dm.rotation.y=0; dm.scale.setScalar(1); dm.updateMatrix();
        bMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.20,z); dm.updateMatrix(); hMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.14,z); dm.updateMatrix(); aMs[ci].setMatrixAt(idx,dm.matrix);
      }
      const nW = Math.floor(Math.PI/2*rc/SD);
      for (let i = 0; i < nW; i++) {
        const a = (i+0.5)/nW*Math.PI/2;
        const x = SL + rc*Math.cos(a), z = -rc*Math.sin(a);
        const ci = Math.abs(i*5+t*7)%NC, idx = sc[ci]++;
        if (idx>=perC) continue;
        dm.position.set(x,ty,z); dm.rotation.y=-(a+Math.PI/2); dm.scale.setScalar(1); dm.updateMatrix();
        bMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.20,z); dm.rotation.y=-(a+Math.PI/2); dm.updateMatrix(); hMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.14,z); dm.rotation.y=-(a+Math.PI/2); dm.updateMatrix(); aMs[ci].setMatrixAt(idx,dm.matrix);
      }
      for (let i = 0; i < nW; i++) {
        const a = Math.PI/2 + (i+0.5)/nW*Math.PI/2;
        const x = -SL + rc*Math.cos(a), z = -rc*Math.sin(a);
        const ci = Math.abs(i*3+t*11)%NC, idx = sc[ci]++;
        if (idx>=perC) continue;
        dm.position.set(x,ty,z); dm.rotation.y=-(a+Math.PI/2); dm.scale.setScalar(1); dm.updateMatrix();
        bMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.20,z); dm.rotation.y=-(a+Math.PI/2); dm.updateMatrix(); hMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.14,z); dm.rotation.y=-(a+Math.PI/2); dm.updateMatrix(); aMs[ci].setMatrixAt(idx,dm.matrix);
      }
    }
    bMs.forEach((m,i)=>{

      hMs[i].count=sc[i]; hMs[i].instanceMatrix.needsUpdate=true; hMs[i].castShadow=true; scene.add(hMs[i]);

    // ─── FLOODLIGHT TOWERS ──────────────────────────────────────────────────

    // ─── FLAGS ──────────────────────────────────────────────────────────────

    // ─── BA FIELD EVENTS ────────────────────────────────────────────────────

    // Pit frame (darker border)

    [[3.0,0.04,-2.85],[3.0,0.04,-1.15],[1.10,0.04,-2.0],[4.90,0.04,-2.0]].forEach(([px,py,pz],i)=>{

      pb.position.set(px,py,pz); scene.add(pb);

    // — HIGH JUMP (center infield, Z = -3.2, uprights parallel to X axis) —

      // Upright base

    // Crossbar
    const hjBar=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,2.2,8),

    // ─── CHIBI V2 PREMIUM CHARACTERS ─────────────────────────────────────────
    function buildPremiumHair(headR,style,mat){
      const g=new THREE.Group();
      if(style==='spiky'){
        const cap=new THREE.Mesh(new THREE.SphereGeometry(headR*0.96,12,10),mat);
        cap.position.y=headR*0.22; cap.scale.set(1,0.62,1); g.add(cap);
        for(let s=0;s<7;s++){const a=(s/7)*Math.PI*2;
          const sp=new THREE.Mesh(new THREE.ConeGeometry(headR*0.14,headR*0.42,5),mat);
          sp.position.set(Math.sin(a)*headR*0.58,headR*0.88+Math.abs(Math.cos(a))*0.06,Math.cos(a)*headR*0.32);
          sp.rotation.z=Math.sin(a)*0.52; sp.rotation.x=-0.16+Math.cos(a)*0.26; g.add(sp);}
      }else if(style==='ponytail'){
        const cap=new THREE.Mesh(new THREE.SphereGeometry(headR*0.96,12,10),mat);
        cap.position.y=headR*0.18; cap.scale.set(1,0.65,1); g.add(cap);
        const bun=new THREE.Mesh(new THREE.SphereGeometry(headR*0.22,8,7),mat);
        bun.position.set(0,headR*0.85,-headR*0.72); g.add(bun);
        const tail=new THREE.Mesh(new THREE.CylinderGeometry(headR*0.14,headR*0.06,headR*1.1,8),mat);
        tail.position.set(0,headR*0.44,-headR*0.90); tail.rotation.x=-0.55; g.add(tail);
      }else if(style==='curly'){
        const cap=new THREE.Mesh(new THREE.SphereGeometry(headR*0.97,12,10),mat);
        cap.position.y=headR*0.25; cap.scale.set(1.05,0.68,1.02); g.add(cap);
        for(let s=0;s<10;s++){const a=(s/10)*Math.PI*2;
          const curl=new THREE.Mesh(new THREE.SphereGeometry(headR*0.26,8,7),mat);
          curl.position.set(Math.sin(a)*headR*0.72,headR*0.62+Math.abs(Math.sin(s))*0.12,Math.cos(a)*headR*0.44);g.add(curl);}
      }else if(style==='long'){
        const cap=new THREE.Mesh(new THREE.SphereGeometry(headR*0.97,12,10),mat);
        cap.position.y=headR*0.18; cap.scale.set(1,0.65,1); g.add(cap);
        [-1,1].forEach(side=>{
          const fPts=[new THREE.Vector2(0,0),new THREE.Vector2(headR*0.30,-headR*0.35),
            new THREE.Vector2(headR*0.40,-headR*0.90),new THREE.Vector2(headR*0.35,-headR*1.50),
            new THREE.Vector2(headR*0.22,-headR*2.10),new THREE.Vector2(0.01,-headR*2.55)];
          const flow=new THREE.Mesh(new THREE.LatheGeometry(fPts,8,0,Math.PI*0.42),mat);
          flow.position.set(side*headR*0.56,headR*0.70,-headR*0.12);
          flow.rotation.y=side*(-Math.PI*0.5); g.add(flow);
        });
        const bkPts=[];
        for(let i=0;i<=8;i++){const f=i/8;bkPts.push(new THREE.Vector2(headR*(0.85-f*0.58),headR*(0.65-f*3.2)));}
        const bk=new THREE.Mesh(new THREE.LatheGeometry(bkPts,16,0,Math.PI),mat);
        bk.rotation.y=Math.PI; bk.position.y=headR*0.1; g.add(bk);
      }else{
        const cap=new THREE.Mesh(new THREE.SphereGeometry(headR*0.95,12,10),mat);
        cap.position.y=headR*0.15; cap.scale.set(1,0.60,1); g.add(cap);
      }
      return g;
    }

    function buildChibiV2(cfg){
      const{color,hairStyle,hairColor,physique='average',skinColor=0xE8C090}=cfg;
      const root=new THREE.Group();
      const PH={
        average: {bx:0.26,bz:0.22,lx:0.108,legLen:0.36},
        chubby:  {bx:0.35,bz:0.30,lx:0.135,legLen:0.33},
        muscular:{bx:0.32,bz:0.26,lx:0.128,legLen:0.38},
        obese:   {bx:0.46,bz:0.40,lx:0.170,legLen:0.30},
      }[physique];
      const skinMat =new THREE.MeshStandardMaterial({color:skinColor,roughness:0.65});
      const jerseyMat=new THREE.MeshStandardMaterial({color,roughness:0.72});
      const shortsMat=new THREE.MeshStandardMaterial({color:0x1A1A30,roughness:0.78});
      const hairMat  =new THREE.MeshStandardMaterial({color:hairColor,roughness:0.72});
      const shoeMat  =new THREE.MeshStandardMaterial({color:0xF8F8F8,roughness:0.55});
      const soleMat  =new THREE.MeshStandardMaterial({color:0x303030,roughness:0.82});
      const bibMat   =new THREE.MeshStandardMaterial({color:0xFFFFF0,roughness:0.5});
      const cheekMat =new THREE.MeshStandardMaterial({color:0xF09880,roughness:0.65,transparent:true,opacity:0.55});
      const HIP_Y=0.72,BODY_H=0.56,headR=0.365;
      const SHOULDER_Y=HIP_Y+BODY_H,HEAD_Y=SHOULDER_Y+0.14+headR;

      const hipSep=PH.bx*0.65;
      const lLegGrp=new THREE.Group(); lLegGrp.position.set(-hipSep,HIP_Y,0);
      const rLegGrp=new THREE.Group(); rLegGrp.position.set( hipSep,HIP_Y,0);
      [lLegGrp,rLegGrp].forEach(lg=>{
        const ul=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(PH.lx*0.90,PH.lx*0.85,PH.legLen,8),shortsMat));
        ul.position.y=-PH.legLen/2; lg.add(ul);
        const kGrp=new THREE.Group(); kGrp.position.y=-PH.legLen;
        const ll=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(PH.lx*0.78,PH.lx*0.72,PH.legLen*0.88,8),skinMat));
        ll.position.y=-PH.legLen*0.44; kGrp.add(ll);
        const shoe=addShadow(new THREE.Mesh(new THREE.SphereGeometry(PH.lx*0.92,10,8),shoeMat));
        shoe.scale.set(1.0,0.50,1.55); shoe.position.set(0,-PH.legLen*0.88,PH.lx*0.35); kGrp.add(shoe);
        const sole=new THREE.Mesh(new THREE.BoxGeometry(PH.lx*1.9,0.04,PH.lx*3.0),soleMat);
        sole.position.set(0,-PH.legLen*0.88-PH.lx*0.45,PH.lx*0.35); kGrp.add(sole);
        lg.add(kGrp); lg.userData.kneeGrp=kGrp;
      });
      root.add(lLegGrp); root.add(rLegGrp);

      const bodyGrp=new THREE.Group(); bodyGrp.position.y=HIP_Y+BODY_H*0.42;
      const bodyMesh=addShadow(new THREE.Mesh(new THREE.SphereGeometry(0.40,16,12),jerseyMat));
      bodyMesh.scale.set(PH.bx/0.40,BODY_H/0.80,PH.bz/0.40); bodyGrp.add(bodyMesh);
      const bib=new THREE.Mesh(new THREE.BoxGeometry(PH.bx*0.88,0.22,0.018),bibMat);
      bib.position.set(0,0.02,PH.bz+0.01); bodyGrp.add(bib);
      const bibLine=new THREE.Mesh(new THREE.BoxGeometry(PH.bx*0.68,0.055,0.012),jerseyMat);
      bibLine.position.set(0,-0.045,PH.bz+0.014); bodyGrp.add(bibLine);
      root.add(bodyGrp);

      const shoulderSep=PH.bx*1.08;
      const lArmGrp=new THREE.Group(); lArmGrp.position.set(-shoulderSep,SHOULDER_Y,0); lArmGrp.rotation.z=0.15;
      const rArmGrp=new THREE.Group(); rArmGrp.position.set( shoulderSep,SHOULDER_Y,0); rArmGrp.rotation.z=-0.15;
      [lArmGrp,rArmGrp].forEach(ag=>{
        const armLen=0.28;
        const ua=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.058,armLen,8),jerseyMat));
        ua.position.y=-armLen/2; ag.add(ua);
        const eGrp=new THREE.Group(); eGrp.position.y=-armLen;
        const la=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.045,armLen*0.88,8),skinMat));
        la.position.y=-armLen*0.44; eGrp.add(la);
        const hand=addShadow(new THREE.Mesh(new THREE.SphereGeometry(0.062,8,7),skinMat));
        hand.position.y=-armLen*0.88; eGrp.add(hand);
        ag.add(eGrp); ag.userData.elbowGrp=eGrp;
      });
      root.add(lArmGrp); root.add(rArmGrp);

      const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.082,0.092,0.14,8),skinMat);
      neck.position.set(0,SHOULDER_Y+0.04,0); root.add(neck);

      const headGrp=new THREE.Group(); headGrp.position.set(0,HEAD_Y,0);
      const hPts=[
        new THREE.Vector2(0.01,      -headR),
        new THREE.Vector2(headR*0.44,-headR*0.82),
        new THREE.Vector2(headR*0.84,-headR*0.42),
        new THREE.Vector2(headR*0.98, headR*0.04),
        new THREE.Vector2(headR*0.93, headR*0.48),
        new THREE.Vector2(headR*0.73, headR*0.82),
        new THREE.Vector2(headR*0.36, headR*1.01),
        new THREE.Vector2(0.01,       headR*1.03),
      ];
      const headMesh=addShadow(new THREE.Mesh(new THREE.LatheGeometry(hPts,24),skinMat));
      headMesh.rotation.y=Math.PI; headGrp.add(headMesh);
      [-1,1].forEach(side=>{
        const eg=new THREE.Group();
        eg.position.set(side*headR*0.38,headR*0.14,headR*0.84);
        eg.add(new THREE.Mesh(new THREE.SphereGeometry(headR*0.23,8,7),new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.2})));
        const iris=new THREE.Mesh(new THREE.SphereGeometry(headR*0.155,8,7),new THREE.MeshStandardMaterial({color:0x3A2010,roughness:0.35}));
        iris.position.z=headR*0.07; eg.add(iris);
        const pup=new THREE.Mesh(new THREE.SphereGeometry(headR*0.09,6,5),new THREE.MeshStandardMaterial({color:0x060606,roughness:0.4}));
        pup.position.z=headR*0.09; eg.add(pup);
        const hl=new THREE.Mesh(new THREE.SphereGeometry(headR*0.04,5,4),new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.1}));
        hl.position.set(headR*0.06,headR*0.05,headR*0.11); eg.add(hl);
        headGrp.add(eg);
      });
      const noseMesh=new THREE.Mesh(new THREE.SphereGeometry(headR*0.09,7,6),skinMat);
      noseMesh.scale.set(1.1,0.8,1.0); noseMesh.position.set(0,-headR*0.09,headR*0.94); headGrp.add(noseMesh);
      const smileMesh=new THREE.Mesh(new THREE.TorusGeometry(headR*0.19,headR*0.04,6,12,Math.PI*0.72),
        new THREE.MeshStandardMaterial({color:0xBB4444,roughness:0.5}));
      smileMesh.position.set(0,-headR*0.29,headR*0.87);
      smileMesh.rotation.set(0,0,Math.PI+Math.PI*0.14); headGrp.add(smileMesh);
      [-1,1].forEach(side=>{
        const cheek=new THREE.Mesh(new THREE.SphereGeometry(headR*0.24,8,7),cheekMat);
        cheek.position.set(side*headR*0.67,-headR*0.24,headR*0.78); headGrp.add(cheek);
      });
      headGrp.add(buildPremiumHair(headR,hairStyle,hairMat));
      root.add(headGrp);

      root.userData={headGrp,bodyGrp,lLegGrp,rLegGrp,
        lKneeGrp:lLegGrp.userData.kneeGrp, rKneeGrp:rLegGrp.userData.kneeGrp,
        lArmGrp,rArmGrp,
        lElbowGrp:lArmGrp.userData.elbowGrp, rElbowGrp:rArmGrp.userData.elbowGrp};
      return root;
    }

    function animateRun(u,t,phase){
      const s=Math.sin(t*7.5+phase);
      u.lLegGrp.rotation.x=-s*0.80; u.rLegGrp.rotation.x= s*0.80;
      u.lKneeGrp.rotation.x=0.10+Math.max(0, s)*0.85;
      u.rKneeGrp.rotation.x=0.10+Math.max(0,-s)*0.85;
      u.lArmGrp.rotation.x= s*0.62; u.rArmGrp.rotation.x=-s*0.62;
      u.lElbowGrp.rotation.x=0.22+Math.abs(Math.cos(t*7.5+phase))*0.40;
      u.rElbowGrp.rotation.x=0.22+Math.abs(Math.cos(t*7.5+phase+Math.PI))*0.40;
      u.bodyGrp.rotation.z=s*0.055; u.headGrp.rotation.z=-s*0.04;
      return Math.abs(s)*0.045;
    }

    const ATHLETES=[
      {color:0xF472B6,hairStyle:'spiky',   hairColor:0x2A1808,skinColor:0xE8C090,pct:0.82,lane:1,phase:0.0},
      {color:0x38BDF8,hairStyle:'ponytail',hairColor:0x5A3820,skinColor:0xDBA870,pct:0.65,lane:3,phase:1.1},
      {color:0xFACC15,hairStyle:'curly',   hairColor:0x181818,skinColor:0xC88860,pct:0.72,lane:5,phase:2.2},
    ];
    const runners=[];
    ATHLETES.forEach((ath,i)=>{
      const g=buildChibiV2(ath);
      g.scale.setScalar(0.72);
      const startS=i/ATHLETES.length;
      const lR=TR+(ath.lane+0.5)*LW;
      const tp=trackPos(startS,lR);
      g.position.set(tp.x,0,tp.z); g.rotation.y=tp.ry;
      scene.add(g);
      runners.push({grp:g,u:g.userData,s:startS,lR,speed:pctToSpeed(ath.pct),phase:ath.phase});
    });

    // ─── BA EVENT ATHLETES ──────────────────────────────────────────────────
    const eventAthletes=[];
    const spBA_g=buildChibiV2({color:0xF472B6,hairStyle:'spiky',hairColor:0x2A1808,physique:'muscular'});
    spBA_g.scale.setScalar(0.82); spBA_g.position.set(-4.5,0,2.0); spBA_g.rotation.y=Math.PI*0.5;
    scene.add(spBA_g);
    eventAthletes.push({grp:spBA_g,u:spBA_g.userData,arms:[spBA_g.userData.lArmGrp,spBA_g.userData.rArmGrp],legs:[spBA_g.userData.lLegGrp,spBA_g.userData.rLegGrp],event:'shotput',offset:0});

    const javBA_g=buildChibiV2({color:0x38BDF8,hairStyle:'curly',hairColor:0x4A3020,physique:'average'});
    javBA_g.scale.setScalar(0.82); javBA_g.position.set(7.5,0,1.8); javBA_g.rotation.y=-Math.PI*0.5;
    scene.add(javBA_g);
    eventAthletes.push({grp:javBA_g,u:javBA_g.userData,arms:[javBA_g.userData.lArmGrp,javBA_g.userData.rArmGrp],legs:[javBA_g.userData.lLegGrp,javBA_g.userData.rLegGrp],event:'javelin',offset:0.33});

    const hjBA_g=buildChibiV2({color:0xFACC15,hairStyle:'long',hairColor:0x2A1A0A,physique:'average',skinColor:0xD4A070});
    hjBA_g.scale.setScalar(0.82); hjBA_g.position.set(-2.5,0,-4.0); hjBA_g.rotation.y=0.4;
    scene.add(hjBA_g);
    eventAthletes.push({grp:hjBA_g,u:hjBA_g.userData,arms:[hjBA_g.userData.lArmGrp,hjBA_g.userData.rArmGrp],legs:[hjBA_g.userData.lLegGrp,hjBA_g.userData.rLegGrp],event:'highjump',offset:0.66});

    // ─── CHARACTER SHOWCASE — Workstream B prototype ──────────────────────────
    const showcaseDefs=[
      {color:0xF472B6,hairStyle:'spiky',  hairColor:0x2A1808,physique:'average', skinColor:0xE8C090,x:-1.0,rY:Math.PI*1.05},
      {color:0xA060E8,hairStyle:'long',   hairColor:0x7A3018,physique:'average', skinColor:0xD4A070,x: 1.0,rY:Math.PI*0.95},
      {color:0x3AD88A,hairStyle:'short',  hairColor:0x181818,physique:'chubby',  skinColor:0xDBA870,x:-2.8,rY:Math.PI*1.05},
      {color:0xFF7030,hairStyle:'curly',  hairColor:0x181818,physique:'muscular',skinColor:0xC88060,x: 2.8,rY:Math.PI*0.95},
    ];
    const showcaseChars=[];
    showcaseDefs.forEach(def=>{
      const g=buildChibiV2(def);
      g.position.set(def.x,0,0.5); g.rotation.y=def.rY;
      scene.add(g);
      showcaseChars.push({grp:g,u:g.userData,phase:showcaseChars.length*1.2});
    });


    // ─── RESIZE ─────────────────────────────────────────────────────────────
    window.addEventListener('resize', ()=>{
      const rW=Math.max(1, canvas.clientWidth||window.innerWidth);
      const rH=Math.max(1, canvas.clientHeight||window.innerHeight);
      renderer.setSize(rW,rH,false);
      camera.aspect=rW/rH; camera.updateProjectionMatrix();
      controls.update();
    });

    // ─── ZOOM BUTTONS + RESET (OrbitControls handles drag/pinch/wheel) ───────
    function camZoomBy(factor) {
      const offset = camera.position.clone().sub(controls.target);
      const newDist = offset.length() * factor;
      if (newDist >= controls.minDistance && newDist <= controls.maxDistance) {
        camera.position.copy(controls.target.clone().add(offset.normalize().multiplyScalar(newDist)));
        controls.update();
      }
    }
    document.getElementById('zin').addEventListener('click',()=>camZoomBy(0.78));
    document.getElementById('zout').addEventListener('click',()=>camZoomBy(1.28));
    document.getElementById('zrst').addEventListener('click',()=>{
      camera.position.copy(CAM_POS_DEFAULT);
      controls.target.copy(CAM_TGT_DEFAULT);
      controls.update();
    });
    document.getElementById('cprev').addEventListener('click',()=>{
      charPreview=!charPreview;
      if(charPreview){
        camera.position.copy(CAM_CHAR_POS);
        controls.target.copy(CAM_CHAR_TGT);
        controls.enableRotate=true; controls.enablePan=false;
        document.getElementById('hint').textContent='Drag to orbit · Scroll to zoom · CHAR to return';
        document.getElementById('badge').innerHTML='<span class="live"></span>Stage 2 · Workstream B · Character Prototype';
        document.getElementById('cprev').textContent='STAD';
      }else{
        camera.position.copy(CAM_POS_DEFAULT);
        controls.target.copy(CAM_TGT_DEFAULT);
        controls.enableRotate=false; controls.enablePan=true;
        document.getElementById('hint').innerHTML='Drag to pan &nbsp;·&nbsp; Scroll or pinch to zoom &nbsp;·&nbsp; ↺ Reset';
        document.getElementById('badge').innerHTML='<span class="live"></span>Stage 2 · Phase 3 · Dusk Diorama Preview';
        document.getElementById('cprev').textContent='CHAR';
      }
      controls.update();
    });

    // ─── ANIMATE ────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    // Animated projectiles for field events
    const javFlight = addShadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.018,0.008,3.8,8),
      new THREE.MeshStandardMaterial({color:0xC0C8D0,roughness:0.35,metalness:0.72})));
    javFlight.visible = false; scene.add(javFlight);

    const shotFlight = addShadow(new THREE.Mesh(
      new THREE.SphereGeometry(0.16,10,9),
      new THREE.MeshStandardMaterial({color:0x606068,roughness:0.5,metalness:0.55})));
    shotFlight.visible = false; scene.add(shotFlight);

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Flags
      FLAGS.forEach((f,i)=>{
        f.mesh.rotation.z = Math.sin(t*2.1+i*0.9)*0.18;
        f.mesh.rotation.x = Math.cos(t*1.7+i*0.6)*0.08;
      });

      // Runners — arc-length positions + full limb animation
      runners.forEach(rn=>{
        rn.s=(rn.s+rn.speed)%1;
        const{x,z,ry}=trackPos(rn.s,rn.lR);
        const bounce=animateRun(rn.u,t,rn.phase);
        rn.grp.position.set(x,bounce,z);
        rn.grp.rotation.y=ry;
      });

      // Showcase characters (always animate)
      showcaseChars.forEach(sc=>{
        sc.grp.position.y=animateRun(sc.u,t,sc.phase);
      });

      // Javelin flight arc animation
      const jCycle = (t % 5) / 5;
      if (jCycle < 0.5) {
        const jf = jCycle / 0.5;
        const jx = 4.5 - jf * 7.0;
        const jy = Math.sin(jf * Math.PI) * 2.8 + 0.05;
        const jz = 1.8;
        javFlight.position.set(jx, jy, jz);
        javFlight.rotation.z = -Math.atan2(Math.cos(jf * Math.PI) * 2.8, 7.0 / 0.5);
        javFlight.rotation.y = Math.PI / 2;
        javFlight.visible = true;
      } else {
        javFlight.visible = false;
      }

      // Shot put arc
      const sCycle = ((t + 2.5) % 4) / 4;
      if (sCycle < 0.4) {
        const sf2 = sCycle / 0.4;
        shotFlight.position.set(-4.5 + sf2 * 0, Math.sin(sf2 * Math.PI) * 1.4 + 0.17, 2.0 + sf2 * 3.5);
        shotFlight.visible = true;
      } else {
        shotFlight.visible = false;
      }

      // Event athlete animations
      eventAthletes.forEach(ea => {
        const ph = ((t * 0.20 + ea.offset) % 1);
        if (ea.event === 'shotput') {
          // Wind-up (0→0.4) → release burst (0.4→0.5) → recover (0.5→1.0)
          if (ph < 0.4) {
            const f = ph / 0.4;
            ea.grp.rotation.y = Math.PI * 0.5 + Math.sin(f * Math.PI) * 0.6;
            ea.arms[0].rotation.x = f * 1.2;
            ea.arms[1].rotation.x = -f * 0.4;
            ea.legs[0].rotation.x = Math.sin(f * Math.PI * 2) * 0.2;
          } else if (ph < 0.5) {
            const f = (ph - 0.4) / 0.1;
            ea.grp.rotation.y = Math.PI * 0.5 + 0.6 - f * 0.8;
            ea.arms[0].rotation.x = 1.2 - f * 1.2;
            ea.arms[1].rotation.x = -0.4 + f * 0.4;
          } else {
            const f = (ph - 0.5) / 0.5;
            ea.grp.rotation.y = Math.PI * 0.5 - 0.2 + f * 0.2;
            ea.arms[0].rotation.x = Math.sin(f * Math.PI) * 0.3;
            ea.arms[1].rotation.x = 0;
          }
        } else if (ea.event === 'javelin') {
          // Run-up (0→0.45) → throw (0.45→0.6) → follow-through (0.6→1.0)
          if (ph < 0.45) {
            const f = ph / 0.45;
            ea.grp.position.x = 7.5 - f * 4.0;
            ea.arms[0].rotation.x = Math.sin(f * Math.PI * 6) * 0.8;
            ea.arms[1].rotation.x = -Math.sin(f * Math.PI * 6) * 0.8;
            ea.legs[0].rotation.x = Math.sin(f * Math.PI * 6 + 0.5) * 0.7;
            ea.legs[1].rotation.x = -Math.sin(f * Math.PI * 6 + 0.5) * 0.7;
          } else if (ph < 0.6) {
            const f = (ph - 0.45) / 0.15;
            ea.grp.position.x = 3.5 - f * 1.0;
            ea.arms[0].rotation.x = 0.8 - f * 1.6;
            ea.arms[1].rotation.x = -0.8 + f * 0.4;
          } else {
            const f = (ph - 0.6) / 0.4;
            ea.grp.position.x = 2.5 + f * 5.0;
            ea.arms[0].rotation.x = -0.8 + f * 0.8;
            ea.arms[1].rotation.x = -0.4 + f * 0.4;
            ea.legs[0].rotation.x = Math.sin(f * Math.PI) * 0.4;
            ea.legs[1].rotation.x = -Math.sin(f * Math.PI) * 0.4;
          }
        } else if (ea.event === 'highjump') {
          // Approach (0→0.5) → jump arc (0.5→0.75) → land (0.75→1.0)
          if (ph < 0.5) {
            const f = ph / 0.5;
            ea.grp.position.x = -2.5 + Math.sin(f * Math.PI * 0.5) * 2.0;
            ea.grp.position.z = -4.0 + f * 1.5;
            ea.grp.position.y = 0;
            ea.grp.rotation.y = 0.4 - f * 0.4;
            ea.arms[0].rotation.x = Math.sin(f * Math.PI * 5) * 0.6;
            ea.arms[1].rotation.x = -Math.sin(f * Math.PI * 5) * 0.6;
            ea.legs[0].rotation.x = Math.sin(f * Math.PI * 5) * 0.5;
            ea.legs[1].rotation.x = -Math.sin(f * Math.PI * 5) * 0.5;
          } else if (ph < 0.75) {
            const f = (ph - 0.5) / 0.25;
            ea.grp.position.y = Math.sin(f * Math.PI) * 1.8;
            ea.grp.rotation.x = Math.sin(f * Math.PI) * (-0.8);
            ea.arms[0].rotation.x = -1.0 + f * 0.5;
            ea.arms[1].rotation.x = 1.0 - f * 0.5;
          } else {
            const f = (ph - 0.75) / 0.25;
            ea.grp.position.y = Math.max(0, (1 - f) * 0.3);
            ea.grp.rotation.x = (1 - f) * (-0.8);
            ea.grp.position.x = -2.5;
            ea.grp.position.z = -4.0;
            ea.grp.rotation.y = 0.4;
            ea.arms[0].rotation.x = -0.5 + f * 0.5;
            ea.arms[1].rotation.x = 0.5 - f * 0.5;
          }
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    setTimeout(()=>{ DBG.style.display='none'; }, 3500);
    log('Workstream B prototype — chibi V2: LatheGeometry head, pivot limbs, 4 physique variants, CHAR button');

  } catch(e) {
    err('Init error: ' + e.message);
    console.error(e);
  }
}

document.addEventListener('DOMContentLoaded', tryInit);
window.addEventListener('load', tryInit);
setTimeout(function(){ if(!_inited) tryInit(); }, 800);
</script>
