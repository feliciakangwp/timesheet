<!DOCTYPE html>
<title>Sprint Track V5 — Stage 2 Stadium Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#121210;font-family:Inter,system-ui,sans-serif}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#badge{position:fixed;top:0;left:0;display:flex;align-items:center;gap:8px;
  background:rgba(14,14,10,.85);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-top:none;border-left:none;
  color:#F0EDE8;font-size:12px;font-weight:600;letter-spacing:.04em;
  padding:9px 16px;border-radius:0 0 10px 0;pointer-events:none;z-index:10}
.live{width:8px;height:8px;border-radius:50%;background:#3DAA60;animation:p 1.8s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
#zoom{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:10}
.zb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(14,14,10,.82);backdrop-filter:blur(10px);
  color:#E8E4DC;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s}
.zb:hover{background:rgba(50,48,40,.9)}
#hint{position:fixed;bottom:22px;left:22px;background:rgba(14,14,10,.75);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
  color:#888078;font-size:11px;padding:7px 12px;border-radius:7px;pointer-events:none;line-height:1.65;z-index:10}
#legend{position:fixed;top:54px;left:14px;background:rgba(14,14,10,.75);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
  color:#C0B8A8;font-size:11px;padding:10px 14px;border-radius:8px;pointer-events:none;z-index:10;line-height:1.8}
.lsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
#dbg{position:fixed;top:120px;left:14px;right:14px;z-index:99;color:#FFCC44;font-size:11px;
  background:rgba(0,0,0,.92);padding:10px 14px;border-radius:8px;font-family:monospace;
  line-height:1.7;display:none;word-break:break-all;border:1px solid rgba(255,204,68,.3)}
</style>

<canvas id="c"></canvas>
<div id="badge"><span class="live"></span>Stage 2 · Live Three.js Scene · V5 Quality Preview</div>
<div id="zoom">
  <button class="zb" id="zin">+</button>
  <button class="zb" id="zout">−</button>
  <button class="zb" id="zrst" title="Reset" style="font-size:13px;letter-spacing:0">↺</button>
</div>
<div id="hint">Drag to pan &nbsp;·&nbsp; Scroll or pinch to zoom &nbsp;·&nbsp; ↺ Reset</div>
<div id="legend">
  <div><span class="lsw" style="background:#C65B42"></span>Running Track</div>
  <div><span class="lsw" style="background:#477B36"></span>Infield Grass</div>
  <div><span class="lsw" style="background:#3D4146"></span>Grandstands</div>
  <div><span class="lsw" style="background:#F472B6"></span>ORION · <span class="lsw" style="background:#38BDF8"></span>POLARIS · <span class="lsw" style="background:#FACC15"></span>CORDIS</div>
</div>
<div id="dbg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';

const DBG = document.getElementById('dbg');
function log(msg) { DBG.style.display = 'block'; DBG.innerHTML += msg + '<br>'; }
function err(msg)  { DBG.style.display = 'block'; DBG.style.color = '#FF6060'; DBG.innerHTML += '⚠ ' + msg + '<br>'; }

let _inited = false;
function tryInit() {
  if (_inited) return;
  _inited = true;

  try {
    log('readyState: ' + document.readyState);

    if (typeof THREE === 'undefined') {
      err('THREE.js not loaded — CDN may be blocked');
      return;
    }
    log('THREE r' + THREE.REVISION + ' loaded');

    const canvas = document.getElementById('c');
    const cW = Math.max(200, canvas.clientWidth  || window.innerWidth  || document.documentElement.clientWidth  || 375);
    const cH = Math.max(200, canvas.clientHeight || window.innerHeight || document.documentElement.clientHeight || 667);
    log('canvas: ' + cW + '×' + cH);

    const testGL = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!testGL) { err('WebGL not available'); return; }
    log('WebGL OK');

    // ─── RENDERER ───────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({antialias:true, canvas});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(cW, cH, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.80;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // ─── SCENE ──────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x4A6A96);
    scene.fog = new THREE.Fog(0x6080A8, 90, 160);

    // ─── CAMERA ─────────────────────────────────────────────────────────────
    // Positioned on the open-front side, looking toward rear grandstand
    let panX = 0, panZ = 0, camDist = 52, CAM_EL = 34;
    const camera = new THREE.PerspectiveCamera(46, cW/cH, 0.1, 200);
    function setCam() {
      camera.position.set(panX + 15, CAM_EL, panZ + camDist * 0.70);
      camera.lookAt(panX, 1, panZ - 10);
    }
    setCam();

    // ─── LIGHTING ───────────────────────────────────────────────────────────
    scene.add(new THREE.HemisphereLight(0x88AACC, 0x3A5C25, 0.35));

    const sun = new THREE.DirectionalLight(0xFFAA55, 2.2);
    sun.position.set(28, 42, 18);
    sun.castShadow = true;
    sun.shadow.mapSize.width  = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.bias = -0.002;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far  = 110;
    sun.shadow.camera.left   = -45;
    sun.shadow.camera.right  =  45;
    sun.shadow.camera.top    =  45;
    sun.shadow.camera.bottom = -45;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x5588BB, 0.40);
    fill.position.set(-22, 18, -14);
    scene.add(fill);

    // ─── TRACK CONSTANTS ────────────────────────────────────────────────────
    const SL  = 9;    // half-length of straights (X axis)
    const TR  = 5.0;  // inner track radius at curves
    const LW  = 0.55; // lane width
    const NL  = 8;    // number of lanes
    const OTR = TR + NL * LW; // outer track radius = 9.4

    // ─── GRANDSTAND CONSTANTS ───────────────────────────────────────────────
    const CLEARANCE = 1.5;           // gap from outer track edge
    const GS_INNER  = OTR + CLEARANCE; // = 10.9 (grandstand inner boundary)
    const TIERS  = 7;
    const TIER_W = 1.3;
    const TIER_H = 0.70;

    // ─── MATERIALS ──────────────────────────────────────────────────────────
    const MAT = {
      grass:    new THREE.MeshStandardMaterial({color:0x3D6B2A, roughness:0.94, metalness:0}),
      infield:  new THREE.MeshStandardMaterial({color:0x477B36, roughness:0.92, metalness:0}),
      track:    new THREE.MeshStandardMaterial({color:0xC65B42, roughness:0.80, metalness:0}),
      concrete: new THREE.MeshStandardMaterial({color:0x3D4146, roughness:0.85, metalness:0.01}),
      concrete2:new THREE.MeshStandardMaterial({color:0x4B5158, roughness:0.87, metalness:0.01}),
      roof:     new THREE.MeshStandardMaterial({color:0x6C7075, roughness:0.60, metalness:0.15, transparent:true, opacity:0.92}),
      steel:    new THREE.MeshStandardMaterial({color:0x555A60, roughness:0.40, metalness:0.75}),
      led:      new THREE.MeshStandardMaterial({color:0x111114, roughness:0.6, emissive:0x0033FF, emissiveIntensity:0.18}),
      scoreGlow:new THREE.MeshStandardMaterial({color:0x080808, roughness:0.5, emissive:0xFF8800, emissiveIntensity:0.5}),
      white:    new THREE.MeshStandardMaterial({color:0xFFFFFF, roughness:0.6}),
      flagRed:  new THREE.MeshStandardMaterial({color:0xE03028, roughness:0.7, side:THREE.DoubleSide}),
      flagYel:  new THREE.MeshStandardMaterial({color:0xF4C020, roughness:0.7, side:THREE.DoubleSide}),
    };

    function addShadow(m) { m.castShadow = true; m.receiveShadow = true; return m; }

    // ─── GEOMETRY HELPERS ───────────────────────────────────────────────────
    function stadiumFillGeo(sl, r) {
      const s = new THREE.Shape();
      s.absarc( sl, 0, r, -Math.PI/2,  Math.PI/2, false);
      s.lineTo(-sl, r);
      s.absarc(-sl, 0, r,  Math.PI/2, 3*Math.PI/2, false);
      s.lineTo( sl, -r);
      const g = new THREE.ShapeGeometry(s, 40);
      g.rotateX(-Math.PI/2);
      return g;
    }

    function stadiumRingGeo(sl, outerR, innerR) {
      const outer = new THREE.Shape();
      outer.absarc( sl, 0, outerR, -Math.PI/2,  Math.PI/2, false);
      outer.lineTo(-sl, outerR);
      outer.absarc(-sl, 0, outerR,  Math.PI/2, 3*Math.PI/2, false);
      outer.lineTo( sl, -outerR);
      const hole = new THREE.Path();
      hole.absarc( sl, 0, innerR, -Math.PI/2,  Math.PI/2, false);
      hole.lineTo(-sl, innerR);
      hole.absarc(-sl, 0, innerR,  Math.PI/2, 3*Math.PI/2, false);
      hole.lineTo( sl, -innerR);
      outer.holes.push(hole);
      const g = new THREE.ShapeGeometry(outer, 40);
      g.rotateX(-Math.PI/2);
      return g;
    }

    // Right corner wing: quarter-arc at center (SL,0), angles 0→PI/2 in 2D
    // After rotateX: covers far-right corner (X>SL, Z<0)
    function qRingR(outerR, innerR) {
      const s = new THREE.Shape();
      s.absarc(SL, 0, outerR, 0, Math.PI/2, false);
      s.absarc(SL, 0, innerR, Math.PI/2, 0, true);
      const g = new THREE.ShapeGeometry(s, 16);
      g.rotateX(-Math.PI/2);
      return g;
    }

    // Left corner wing: quarter-arc at center (-SL,0), angles PI/2→PI in 2D
    // After rotateX: covers far-left corner (X<-SL, Z<0)
    function qRingL(outerR, innerR) {
      const s = new THREE.Shape();
      s.absarc(-SL, 0, outerR, Math.PI/2, Math.PI, false);
      s.absarc(-SL, 0, innerR, Math.PI, Math.PI/2, true);
      const g = new THREE.ShapeGeometry(s, 16);
      g.rotateX(-Math.PI/2);
      return g;
    }

    // ─── GROUND ─────────────────────────────────────────────────────────────
    const gnd = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), MAT.grass);
    gnd.rotation.x = -Math.PI/2; gnd.receiveShadow = true; scene.add(gnd);

    const apron = new THREE.Mesh(stadiumRingGeo(SL, OTR + 1.2, OTR), MAT.concrete);
    apron.position.y = 0.01; apron.receiveShadow = true; scene.add(apron);

    // ─── RUNNING TRACK ──────────────────────────────────────────────────────
    const track = new THREE.Mesh(stadiumRingGeo(SL, OTR, TR), MAT.track);
    track.position.y = 0.02; track.receiveShadow = true; scene.add(track);

    for (let ln = 0; ln <= NL; ln++) {
      const r = TR + ln * LW;
      const line = new THREE.Mesh(stadiumRingGeo(SL, r + 0.025, r), MAT.white);
      line.position.y = 0.035; scene.add(line);
    }

    const sfLine = new THREE.Mesh(new THREE.BoxGeometry(NL * LW + 0.1, 0.01, 0.1), MAT.white);
    sfLine.position.set(SL - 0.5, 0.04, 0); scene.add(sfLine);

    // ─── INFIELD ────────────────────────────────────────────────────────────
    const infield = new THREE.Mesh(stadiumFillGeo(SL, TR), MAT.infield);
    infield.position.y = 0.03; infield.receiveShadow = true; scene.add(infield);

    // ─── DEBUG BOUNDARY OUTLINES (auto-hide after 6s) ───────────────────────
    const dbgTrack = new THREE.Mesh(
      stadiumRingGeo(SL, OTR+0.06, OTR-0.06),
      new THREE.MeshBasicMaterial({color:0xFF3030, side:THREE.DoubleSide}));
    dbgTrack.position.y = 0.06; scene.add(dbgTrack);
    const dbgGS = new THREE.Mesh(
      stadiumRingGeo(SL, GS_INNER+0.06, GS_INNER-0.06),
      new THREE.MeshBasicMaterial({color:0x30FF30, side:THREE.DoubleSide}));
    dbgGS.position.y = 0.07; scene.add(dbgGS);
    setTimeout(()=>{ dbgTrack.visible=false; dbgGS.visible=false; }, 6000);
    log('Debug: red=track outer, green=grandstand inner (hide 6s)');

    // ─── U-SHAPED GRANDSTAND (rear + two corner wings, open front) ──────────
    for (let t = 0; t < TIERS; t++) {
      const ri = GS_INNER + t * TIER_W;
      const ro = GS_INNER + (t + 1) * TIER_W;
      const ty = t * TIER_H + 0.01;
      const tm = t % 2 === 0 ? MAT.concrete : MAT.concrete2;

      // 1. Rear straight slab (behind back straight, Z negative)
      const rsb = addShadow(new THREE.Mesh(
        new THREE.BoxGeometry(2 * SL, TIER_H, TIER_W), tm));
      rsb.position.set(0, ty + TIER_H * 0.5, -(ri + TIER_W * 0.5));
      scene.add(rsb);

      // 2. Right corner wing
      const rw = addShadow(new THREE.Mesh(qRingR(ro, ri), tm));
      rw.position.y = ty + TIER_H * 0.5;
      scene.add(rw);

      // 3. Left corner wing
      const lw = addShadow(new THREE.Mesh(qRingL(ro, ri), tm));
      lw.position.y = ty + TIER_H * 0.5;
      scene.add(lw);
    }

    // Back wall (vertical face behind top tier)
    const bkW = addShadow(new THREE.Mesh(
      new THREE.BoxGeometry(2*SL, TIERS*TIER_H, 0.28), MAT.concrete));
    bkW.position.set(0, TIERS*TIER_H*0.5, -(GS_INNER + TIERS*TIER_W));
    scene.add(bkW);

    // Canopy roof over rear straight
    const rfMesh = addShadow(new THREE.Mesh(
      new THREE.BoxGeometry(2*SL + 2, 0.2, TIERS*TIER_W + 0.8), MAT.roof));
    rfMesh.position.set(0, TIERS*TIER_H + 1.75, -(GS_INNER + TIERS*TIER_W*0.5));
    scene.add(rfMesh);

    // Support columns under canopy
    for (let c = 0; c <= 4; c++) {
      const cx = SL * (c/2 - 1);
      const col = addShadow(new THREE.Mesh(
        new THREE.CylinderGeometry(0.13, 0.17, TIERS*TIER_H + 1.9, 8), MAT.steel));
      col.position.set(cx, (TIERS*TIER_H + 1.9)*0.5, -(GS_INNER + TIERS*TIER_W + 0.4));
      scene.add(col);
    }

    // ─── SPECTATORS (on U-shaped grandstand only) ────────────────────────────
    const SCOLS = [0xE03428,0x3478D8,0xE8C030,0x28A848,0xE070B0,0x8860D8,0xE86020,0xD4D0C0,0xFFFFFF,0x222244];
    const bGeo = new THREE.CylinderGeometry(0.065,0.075,0.22,7);
    const hGeo = new THREE.SphereGeometry(0.085,8,6);
    const NC = SCOLS.length;
    const SD = 0.44; // spectator spacing

    let totalSpec = 0;
    for (let t = 0; t < TIERS; t++) {
      const rc = GS_INNER + t*TIER_W + TIER_W*0.5;
      totalSpec += Math.floor(2*SL/SD) + 2*Math.floor(Math.PI/2*rc/SD);
    }
    const perC = Math.ceil(totalSpec/NC);
    const bMs = SCOLS.map(c=>new THREE.InstancedMesh(bGeo, new THREE.MeshStandardMaterial({color:c,roughness:0.75}), perC));
    const hMs = SCOLS.map(()=>new THREE.InstancedMesh(hGeo, new THREE.MeshStandardMaterial({color:0xE8C090,roughness:0.65}), perC));
    const sc = new Array(NC).fill(0), dm = new THREE.Object3D();

    for (let t = 0; t < TIERS; t++) {
      const ri = GS_INNER + t*TIER_W;
      const rc = ri + TIER_W*0.5;
      const ty = t*TIER_H + TIER_H + 0.12;

      // Rear straight row
      const nR = Math.floor(2*SL/SD);
      for (let i = 0; i < nR; i++) {
        const x = -SL + (i+0.5)*(2*SL/nR);
        const z = -rc;
        const ci = Math.abs(i*7+t*3)%NC, idx = sc[ci]++;
        if (idx>=perC) continue;
        dm.position.set(x,ty,z); dm.rotation.y=0; dm.scale.setScalar(1); dm.updateMatrix();
        bMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.175,z); dm.updateMatrix();
        hMs[ci].setMatrixAt(idx,dm.matrix);
      }

      // Right wing (quarter arc)
      const nW = Math.floor(Math.PI/2*rc/SD);
      for (let i = 0; i < nW; i++) {
        const a = (i+0.5)/nW*Math.PI/2;
        const x = SL + rc*Math.cos(a);
        const z = -rc*Math.sin(a);
        const ci = Math.abs(i*5+t*7)%NC, idx = sc[ci]++;
        if (idx>=perC) continue;
        dm.position.set(x,ty,z); dm.rotation.y=-(a+Math.PI/2); dm.scale.setScalar(1); dm.updateMatrix();
        bMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.175,z); dm.rotation.y=-(a+Math.PI/2); dm.updateMatrix();
        hMs[ci].setMatrixAt(idx,dm.matrix);
      }

      // Left wing (mirrored quarter arc)
      for (let i = 0; i < nW; i++) {
        const a = Math.PI/2 + (i+0.5)/nW*Math.PI/2;
        const x = -SL + rc*Math.cos(a);
        const z = -rc*Math.sin(a);
        const ci = Math.abs(i*3+t*11)%NC, idx = sc[ci]++;
        if (idx>=perC) continue;
        dm.position.set(x,ty,z); dm.rotation.y=-(a+Math.PI/2); dm.scale.setScalar(1); dm.updateMatrix();
        bMs[ci].setMatrixAt(idx,dm.matrix);
        dm.position.set(x,ty+0.175,z); dm.rotation.y=-(a+Math.PI/2); dm.updateMatrix();
        hMs[ci].setMatrixAt(idx,dm.matrix);
      }
    }
    bMs.forEach((m,i)=>{
      m.instanceMatrix.needsUpdate=true; m.castShadow=true; m.receiveShadow=true; scene.add(m);
      hMs[i].instanceMatrix.needsUpdate=true; hMs[i].castShadow=true; scene.add(hMs[i]);
    });

    // ─── FLOODLIGHT TOWERS ──────────────────────────────────────────────────
    [[-SL-2, 2],[SL+2, 2],[-SL-2, -(OTR+6)],[SL+2, -(OTR+6)],[0, -(OTR+8)]].forEach(([tx,tz])=>{
      const twr = addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.18,20,8), MAT.steel));
      twr.position.set(tx,10,tz); scene.add(twr);
      const lamp = addShadow(new THREE.Mesh(new THREE.BoxGeometry(1.2,0.2,0.35), MAT.scoreGlow));
      lamp.position.set(tx,20,tz+0.6); lamp.rotation.x=-0.3; scene.add(lamp);
      const halo = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8),
        new THREE.MeshStandardMaterial({color:0xFFEE88, emissive:0xFFCC44, emissiveIntensity:2.2, roughness:1}));
      halo.position.set(tx,19.5,tz); scene.add(halo);
    });

    // ─── SCOREBOARD ─────────────────────────────────────────────────────────
    const sbZ = -(GS_INNER + TIERS*TIER_W + 0.9);
    const sbY = TIERS*TIER_H;
    const sbBase = addShadow(new THREE.Mesh(new THREE.BoxGeometry(8,0.5,0.4), MAT.concrete));
    sbBase.position.set(0, sbY + 2.4, sbZ); scene.add(sbBase);
    const sbScr = addShadow(new THREE.Mesh(new THREE.BoxGeometry(7.2,2.8,0.2), MAT.led));
    sbScr.position.set(0, sbY + 3.6, sbZ+0.15); scene.add(sbScr);

    // ─── AD BOARDS ──────────────────────────────────────────────────────────
    const adC=[0xE03428,0x2878D0,0xE8A820,0x28A058,0xD040A0];
    [0.85,1.0,1.15,1.35,1.65,1.8].forEach((f,i)=>{
      const ang=Math.PI*f;
      const ad = addShadow(new THREE.Mesh(new THREE.BoxGeometry(2.8,0.9,0.12),
        new THREE.MeshStandardMaterial({color:adC[i%5], roughness:0.5, emissive:adC[i%5], emissiveIntensity:0.1})));
      ad.position.set(Math.cos(ang)*13.8, 0.5, Math.sin(ang)*10);
      ad.rotation.y=-(ang+Math.PI/2); scene.add(ad);
    });

    // ─── FLAGS ──────────────────────────────────────────────────────────────
    const FLAGS=[];
    const fMats=[MAT.flagRed,MAT.flagYel,MAT.flagRed,MAT.flagYel,MAT.flagRed,MAT.flagYel];
    [-7,-4,-1,2,5,8].forEach((fx,i)=>{
      const fz = -(GS_INNER + TIERS*TIER_W + 0.3);
      const staff=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,3,6), MAT.steel));
      staff.position.set(fx, TIERS*TIER_H+2.5, fz); scene.add(staff);
      const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.5), fMats[i]);
      flag.position.set(fx+0.4, TIERS*TIER_H+3.8, fz+0.1);
      flag.rotation.y=0; scene.add(flag);
      FLAGS.push({mesh:flag});
    });

    // ─── CHIBI ATHLETES ─────────────────────────────────────────────────────
    function makeLatheHead(r) {
      const pts=[new THREE.Vector2(0.01,-r*0.9),new THREE.Vector2(r*0.55,-r*0.6),
        new THREE.Vector2(r*0.9,-r*0.1),new THREE.Vector2(r*0.95,r*0.25),
        new THREE.Vector2(r*0.85,r*0.6),new THREE.Vector2(r*0.55,r*0.9),
        new THREE.Vector2(r*0.15,r*1.0),new THREE.Vector2(0.01,r*1.0)];
      return new THREE.LatheGeometry(pts,16);
    }
    function makeEye(side, headR) {
      const g=new THREE.Group();
      g.add(new THREE.Mesh(new THREE.SphereGeometry(headR*0.22,8,7), new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.3})));
      const iris=new THREE.Mesh(new THREE.SphereGeometry(headR*0.15,8,7), new THREE.MeshStandardMaterial({color:0x3A2810,roughness:0.4}));
      iris.position.z=headR*0.05; g.add(iris);
      const pup=new THREE.Mesh(new THREE.SphereGeometry(headR*0.09,6,5), new THREE.MeshStandardMaterial({color:0x080808,roughness:0.5}));
      pup.position.z=headR*0.06; g.add(pup);
      g.position.set(side*headR*0.38, headR*0.1, headR*0.82);
      return g;
    }
    function makeHair(headR, style, color) {
      const g=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color,roughness:0.7});
      if(style==='spiky'){
        for(let s=0;s<6;s++){const a=(s/6)*Math.PI*2;const h=new THREE.Mesh(new THREE.ConeGeometry(headR*0.18,headR*0.45,6),mat);h.position.set(Math.sin(a)*headR*0.6,headR*0.85,Math.cos(a)*headR*0.35);h.rotation.z=Math.sin(a)*0.6;h.rotation.x=-0.2+Math.cos(a)*0.3;g.add(h);}
      }else if(style==='ponytail'){
        const top=new THREE.Mesh(new THREE.SphereGeometry(headR*0.92,10,9),mat);top.position.y=headR*0.2;top.scale.set(1,0.7,1);g.add(top);
        const tail=new THREE.Mesh(new THREE.CylinderGeometry(headR*0.14,headR*0.08,headR*1.2,8),mat);tail.position.set(0,-headR*0.5,-headR*0.8);tail.rotation.x=-0.5;g.add(tail);
      }else if(style==='curly'){
        for(let s=0;s<8;s++){const a=(s/8)*Math.PI*2;const curl=new THREE.Mesh(new THREE.SphereGeometry(headR*0.28,7,6),mat);curl.position.set(Math.sin(a)*headR*0.65,headR*0.55+Math.abs(Math.sin(a))*0.15,Math.cos(a)*headR*0.4);g.add(curl);}
      }else{
        const cap=new THREE.Mesh(new THREE.SphereGeometry(headR*0.93,10,8),mat);cap.position.y=headR*0.18;cap.scale.set(1,0.65,1);g.add(cap);
      }
      return g;
    }

    const ATHLETES=[
      {color:0xF472B6,hair:'spiky',   hcol:0x3A2010,pct:0.82, lane:0},
      {color:0x38BDF8,hair:'ponytail',hcol:0x5A3820,pct:0.65, lane:1},
      {color:0xFACC15,hair:'curly',   hcol:0x1A1A1A,pct:0.48, lane:2},
      {color:0xF472B6,hair:'side',    hcol:0x1A1A1A,pct:0.55, lane:3},
      {color:0x38BDF8,hair:'spiky',   hcol:0x4A3020,pct:0.78, lane:4},
    ];
    const TPS=[
      {angle:-0.1, lane:0},
      {angle: 0.3, lane:1},
      {angle: 0.7, lane:2},
      {angle: 1.1, lane:3},
      {angle: 1.5, lane:4},
    ];
    const runners=[];

    ATHLETES.forEach((ath,i)=>{
      const {color,hair,hcol,pct,lane}=ath, tp=TPS[i], g=new THREE.Group();
      const headR=0.38, bodyH=0.52+(pct<0.5?0.1:pct>0.75?-0.05:0);
      const torsoW=pct<0.5?0.28:pct<0.65?0.22:pct>0.75?0.24:0.18;
      const jMat=new THREE.MeshStandardMaterial({color,roughness:0.72});
      const dMat=new THREE.MeshStandardMaterial({color:0x1A1A30,roughness:0.78});
      const sMat=new THREE.MeshStandardMaterial({color,roughness:0.65,metalness:0.05});
      const skMat=new THREE.MeshStandardMaterial({color:0xE8C090,roughness:0.68});

      const body=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(torsoW*0.82,torsoW,bodyH,10),jMat));
      body.position.y=0.4;
      const collar=new THREE.Mesh(new THREE.CylinderGeometry(torsoW*0.5,torsoW*0.55,0.06,10),jMat);
      collar.position.y=0.4+bodyH/2-0.02;
      const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.07,0.14,8),skMat);
      neck.position.y=0.4+bodyH/2+0.06;
      const head=addShadow(new THREE.Mesh(makeLatheHead(headR),new THREE.MeshStandardMaterial({color:0xF0C080,roughness:0.65})));
      head.position.y=0.4+bodyH/2+0.14+headR; head.rotation.y=Math.PI;
      const eyeL=makeEye(-1,headR), eyeR=makeEye(1,headR);
      eyeL.position.y=eyeR.position.y=0.4+bodyH/2+0.14+headR;
      eyeL.rotation.y=eyeR.rotation.y=Math.PI;
      [-1,1].forEach(s=>{
        const cheek=new THREE.Mesh(new THREE.SphereGeometry(headR*0.28,8,7),new THREE.MeshStandardMaterial({color:0xF09880,roughness:0.65,transparent:true,opacity:0.55}));
        cheek.position.set(s*headR*0.7,0.4+bodyH/2+0.14+headR,headR*0.75); g.add(cheek);
      });
      const hairGrp=makeHair(headR,hair,hcol);
      hairGrp.position.y=0.4+bodyH/2+0.14+headR; hairGrp.rotation.y=Math.PI;
      const rph=i*1.57;
      [-1,1].forEach((side,ai)=>{
        const arm=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.065,0.38,8),ai===0?jMat:skMat));
        arm.position.set(side*(torsoW+0.06),0.4+bodyH/2-0.1,0);
        arm.rotation.z=side*0.55; arm.rotation.x=(side>0?Math.sin(rph+1):Math.cos(rph))*0.6; g.add(arm);
      });
      [-1,1].forEach((side,li)=>{
        const leg=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.08,0.42,9),dMat));
        leg.position.set(side*0.09,0.22,0); leg.rotation.x=(side>0?Math.sin(rph):Math.cos(rph))*0.55; g.add(leg);
        const shoe=addShadow(new THREE.Mesh(new THREE.SphereGeometry(0.115,10,8),sMat));
        shoe.scale.set(1,0.55,1.4);
        shoe.position.set(side*0.09,0.045+Math.abs((side>0?Math.sin(rph):Math.cos(rph))*0.18),0.06); g.add(shoe);
      });
      const bib=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.20,0.02),new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.5}));
      bib.position.set(0,0.4+bodyH/2-0.12,torsoW+0.01); g.add(bib,body,collar,neck,head,eyeL,eyeR,hairGrp);
      const initLR = TR + (lane + 0.5) * LW;
      const initA = tp.angle;
      const initPx = Math.cos(initA)*initLR + Math.sign(Math.cos(initA)||1)*SL*(1-Math.abs(Math.sin(initA)));
      const initPz = Math.sin(initA)*initLR;
      g.position.set(initPx, 0, initPz);
      g.rotation.y=-(initA+Math.PI/2-0.1);
      scene.add(g);
      runners.push({grp:g, phase:i*0.9, tAngle:tp.angle, lane, speed:0.008+pct*0.004});
    });

    // ─── FIELD PROPS ────────────────────────────────────────────────────────
    const jav=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.01,3.5,8),new THREE.MeshStandardMaterial({color:0xC0C0C0,roughness:0.4,metalness:0.7})));
    jav.position.set(-4,0.04,2); jav.rotation.z=0.25; jav.rotation.y=0.8; scene.add(jav);
    const shot=addShadow(new THREE.Mesh(new THREE.SphereGeometry(0.14,10,9),new THREE.MeshStandardMaterial({color:0x505058,roughness:0.5,metalness:0.5})));
    shot.position.set(5.4,0.15,2); scene.add(shot);
    const bar=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,2.4,8),new THREE.MeshStandardMaterial({color:0xE04020,roughness:0.5})));
    bar.position.set(-5,1.2,3.5); bar.rotation.z=Math.PI/2; scene.add(bar);
    [-1,1].forEach(s=>{
      const std=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,2.0,8),MAT.steel));
      std.position.set(-5+s*1.2,1.0,3.5); scene.add(std);
    });
    const ljpit=addShadow(new THREE.Mesh(new THREE.BoxGeometry(1.2,0.04,5),new THREE.MeshStandardMaterial({color:0xE8D898,roughness:0.95})));
    ljpit.position.set(0,0.02,4.0); scene.add(ljpit);

    // ─── RESIZE ─────────────────────────────────────────────────────────────
    window.addEventListener('resize', ()=>{
      const rW=Math.max(1, canvas.clientWidth||window.innerWidth);
      const rH=Math.max(1, canvas.clientHeight||window.innerHeight);
      renderer.setSize(rW,rH,false);
      camera.aspect=rW/rH; camera.updateProjectionMatrix();
    });

    // ─── CONTROLS ───────────────────────────────────────────────────────────
    let drag=false, lastMX=0, lastMY=0;
    canvas.addEventListener('mousedown',e=>{drag=true;lastMX=e.clientX;lastMY=e.clientY;});
    window.addEventListener('mouseup',()=>{drag=false;});
    window.addEventListener('mousemove',e=>{
      if(!drag) return;
      const dx=e.clientX-lastMX, dy=e.clientY-lastMY;
      lastMX=e.clientX; lastMY=e.clientY;
      panX-=dx*camDist*0.0015; panZ-=dy*camDist*0.0015;
      panX=Math.max(-18,Math.min(18,panX)); panZ=Math.max(-18,Math.min(18,panZ));
      setCam();
    });
    canvas.addEventListener('wheel',e=>{
      e.preventDefault();
      camDist=Math.max(12,Math.min(65,camDist+e.deltaY*0.04)); setCam();
    },{passive:false});

    let t0=null,t1=null,tD0=0;
    canvas.addEventListener('touchstart',e=>{
      if(e.touches.length===1){t0={x:e.touches[0].clientX,y:e.touches[0].clientY};t1=null;}
      else if(e.touches.length===2){t0={x:e.touches[0].clientX,y:e.touches[0].clientY};t1={x:e.touches[1].clientX,y:e.touches[1].clientY};tD0=Math.hypot(t1.x-t0.x,t1.y-t0.y);}
    },{passive:true});
    canvas.addEventListener('touchmove',e=>{
      e.preventDefault();
      if(e.touches.length===1&&t0&&!t1){
        const dx=e.touches[0].clientX-t0.x, dy=e.touches[0].clientY-t0.y;
        t0={x:e.touches[0].clientX,y:e.touches[0].clientY};
        panX-=dx*camDist*0.002; panZ-=dy*camDist*0.002;
        panX=Math.max(-18,Math.min(18,panX)); panZ=Math.max(-18,Math.min(18,panZ)); setCam();
      }else if(e.touches.length===2){
        const nd=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
        camDist=Math.max(12,Math.min(65,camDist*(tD0/nd))); tD0=nd; setCam();
      }
    },{passive:false});

    document.getElementById('zin').addEventListener('click',()=>{camDist=Math.max(12,camDist-4);setCam();});
    document.getElementById('zout').addEventListener('click',()=>{camDist=Math.min(65,camDist+4);setCam();});
    document.getElementById('zrst').addEventListener('click',()=>{ panX=0; panZ=0; camDist=52; setCam(); });

    // ─── ANIMATE ────────────────────────────────────────────────────────────
    const clock=new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const t=clock.getElapsedTime();
      FLAGS.forEach((f,i)=>{f.mesh.rotation.z=Math.sin(t*2.1+i*0.9)*0.18;f.mesh.rotation.x=Math.cos(t*1.7+i*0.6)*0.08;});
      runners.forEach(rn=>{
        rn.tAngle+=rn.speed;
        const a=rn.tAngle;
        const lR=TR+(rn.lane+0.5)*LW;
        const ca=Math.cos(a), sa=Math.sin(a);
        const px=ca*lR+Math.sign(ca||1)*SL*(1-Math.abs(sa));
        const pz=sa*lR;
        rn.grp.position.set(px, Math.abs(Math.sin(t*3.5+rn.phase*2))*0.04, pz);
        rn.grp.rotation.y=-(a+Math.PI/2-0.1);
      });
      renderer.render(scene,camera);
    }
    animate();

    setTimeout(()=>{ DBG.style.display='none'; }, 3000);
    log('Scene ready ✓');

  } catch(e) {
    err('Init error: ' + e.message);
    console.error(e);
  }
}

document.addEventListener('DOMContentLoaded', tryInit);
window.addEventListener('load', tryInit);
setTimeout(function(){ if(!_inited) tryInit(); }, 800);
</script>
